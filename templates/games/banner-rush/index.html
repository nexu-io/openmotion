<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Banner Rush</title><style>

</style></head><body><canvas width="900" height="1600" aria-label="Banner Rush"></canvas><script>
'use strict';
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d');
const W=450,H=800,SC=2;
const zh=(navigator.language||'').toLowerCase().startsWith('zh');
const T=(a,b)=>zh?a:b;
document.documentElement.lang=zh?'zh-CN':'en';
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let prog=load('banner-rush-progress',{cleared:0,best:[0,0,0]}),muted=load('banner-rush-muted',false);
if(!prog||!Array.isArray(prog.best))prog={cleared:0,best:[0,0,0]};

/* ---------- audio ---------- */
let actx=null;
function unlock(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)try{actx=new A()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});}
function tone(f,d=.1,type='triangle',vol=.05,slide=.7){if(muted||!actx)return;try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d+.02);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.04);}catch(e){}}
function chord(fs,gap=.08){fs.forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.05,1),i*gap*1000));}
let tickSnd=0;

/* ---------- helpers ---------- */
function rr(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function circ(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
const FONT='system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
function txt(s,x,y,size=18,color='#2b2620',align='center',maxW=420,weight=800){ctx.font=`${weight} ${size}px ${FONT}`;while(ctx.measureText(s).width>maxW&&size>9){size-=.5;ctx.font=`${weight} ${size}px ${FONT}`;}ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function otxt(s,x,y,size,color,outline='#fffaf0',align='center',maxW=420){ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.lineJoin='round';ctx.lineWidth=size/4.5;ctx.strokeStyle=outline;ctx.textAlign=align;ctx.textBaseline='middle';ctx.strokeText(s,x,y);ctx.restore();txt(s,x,y,size,color,align,maxW,900);}
function button(x,y,w,h,label,c,tc='#fff',pulse=0){ctx.save();ctx.translate(x+w/2,y+h/2);const s=1+pulse;ctx.scale(s,s);rr(-w/2,-h/2+4,w,h,h/2,'rgba(60,40,20,.25)');rr(-w/2,-h/2,w,h,h/2,c);txt(label,0,1,19,tc,'center',w-16,900);ctx.restore();}
const inR=(p,x,y,w,h)=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;

/* ---------- factions & maps ---------- */
const FAC=[{n:['中立','Neutral'],c:'#b9b1a2',d:'#8f8778'},{n:['你·蓝旗','You · Azure'],c:'#3d7bf0',d:'#2453b0'},{n:['赤旗','Crimson'],c:'#ec5644',d:'#a8321f'},{n:['金旗','Gold'],c:'#e6a91f',d:'#a8770e'}];
// castle: [x,y,size,owner,troops]
const MAPS=[
 {n:['青谷','Greenvale'],ai:4.2,aiMin:14,c:[[225,655,2,1,22],[95,165,2,2,18],[355,165,2,3,18],[225,410,3,0,16],[105,305,1,0,7],[345,305,1,0,7],[100,530,1,0,6],[350,530,1,0,6],[225,235,1,0,10]],
  e:[[0,6],[0,7],[0,3],[6,4],[7,5],[3,4],[3,5],[3,8],[4,1],[5,2],[8,1],[8,2],[6,3],[7,3]]},
 {n:['河望','Riverwatch'],ai:2.3,aiMin:10,c:[[90,650,2,1,22],[360,650,2,2,22],[225,140,2,3,22],[225,420,3,0,22],[110,470,1,0,9],[340,470,1,0,9],[225,600,1,0,10],[95,285,1,0,9],[355,285,1,0,9],[225,280,2,0,14],[225,720,1,0,5]],
  e:[[0,4],[0,6],[0,10],[1,5],[1,6],[1,10],[2,7],[2,8],[2,9],[4,3],[5,3],[6,3],[9,3],[7,4],[8,5],[7,9],[8,9]]},
 {n:['王冠峰','Crownpeaks'],ai:1.6,aiMin:9,c:[[225,690,2,1,24],[70,150,2,2,26],[380,150,2,3,26],[225,430,3,0,26],[120,560,1,0,8],[330,560,1,0,8],[60,420,1,0,10],[390,420,1,0,10],[140,300,2,0,14],[310,300,2,0,14],[225,200,1,0,12],[60,270,1,0,8],[390,270,1,0,8],[225,560,1,0,9]],
  e:[[0,4],[0,5],[0,13],[13,3],[4,6],[5,7],[4,3],[5,3],[6,8],[7,9],[3,8],[3,9],[8,10],[9,10],[8,11],[9,12],[11,1],[12,2],[10,1],[10,2],[6,11],[7,12]]}];

/* ---------- state ---------- */
let phase='title',mapIdx=0,castles=[],edges=[],dots=[],streams=[],parts=[],floats=[],rings=[],aiT=[0,0,0,0],mapTime=0,totalTime=0,artTime=0,lastTs=0,timeScale=1,banner=null,shake=0;
let drag=null,selected=null,hint=true,sendCount=0;
const decor=Array.from({length:26},()=>({x:rand(10,440),y:rand(70,760),k:Math.random()<.6?'tree':'rock',s:rand(.7,1.2)}));
for(const d of decor)d.hide=[[110,250],[340,250],[225,420],[225,590]].some(([x,y])=>Math.hypot(d.x-x,d.y-y)<60)||Math.abs(d.x-225)<20&&d.y>400&&d.y<600||d.y>620||d.y<200;
function setupMap(i){mapIdx=i;const m=MAPS[i];castles=m.c.map(([x,y,size,owner,troops],k)=>({k,x,y,size,owner,troops,r:20+size*6,pulse:0,flash:0,grow:0}));edges=m.e;dots=[];streams=[];parts=[];floats=[];rings=[];aiT=[0,0,m.ai*.8,m.ai*1.2];mapTime=0;drag=null;selected=null;sendCount=0;phase='play';banner={s:T('第 '+(i+1)+' 图 · ','Map '+(i+1)+' · ')+m.n[zh?0:1],life:1.8};chord([392,494,587]);
 for(const d of decor){d.hide=castles.some(c=>Math.hypot(c.x-d.x,c.y-d.y)<c.r+22)||edges.some(([a,b])=>segDist(d,castles[a],castles[b])<14);}}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t);}
function cap(c){return c.owner===0?8+c.size*6:25+c.size*25;}
function burst(x,y,col,n=18,sp=150){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.4,.9),max:.9,col,size:rand(2,4)});}}
function float(x,y,s,col,size=18){floats.push({x,y,s,col,size,life:1});}

/* ---------- core rules ---------- */
function send(src,tgt,owner){if(!src||!tgt||src===tgt||src.owner!==owner)return false;const amt=Math.floor(src.troops/2);if(amt<1)return false;src.troops-=amt;src.pulse=1;const per=Math.max(1,Math.ceil(amt/36));streams.push({src,tgt,owner,left:amt,per,acc:1,sx:src.x,sy:src.y});if(owner===1){sendCount++;tone(520,.08,'triangle',.05,1.3);}return true;}
function emit(dt){for(const s of streams){s.acc+=dt*20;while(s.acc>=1&&s.left>0){s.acc-=1;const v=Math.min(s.per,s.left);s.left-=v;const dx=s.tgt.x-s.sx,dy=s.tgt.y-s.sy,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,off=rand(-6,6);dots.push({x:s.sx+nx*(s.src.r-4)-ny*off,y:s.sy+ny*(s.src.r-4)+nx*off,nx,ny,off,tgt:s.tgt,owner:s.owner,val:v,wob:rand(0,6),dead:false});}}streams=streams.filter(s=>s.left>0);}
function arrive(d){const c=d.tgt;if(c.owner===d.owner){c.troops+=d.val;c.pulse=Math.max(c.pulse,.4);return;}c.troops-=d.val;c.flash=1;if(Math.random()<.35)burst(d.x,d.y,FAC[d.owner].c,3,70);
 if(c.troops<0){const prev=c.owner;c.owner=d.owner;c.troops=-c.troops;c.pulse=1;rings.push({x:c.x,y:c.y,life:.6,col:FAC[d.owner].c});burst(c.x,c.y,FAC[d.owner].c,30,200);if(d.owner===1){float(c.x,c.y-c.r-14,T('占领！','CAPTURED!'),FAC[1].d,18);chord([523,659,784],.05);shake=4;}else if(prev===1){float(c.x,c.y-c.r-14,T('失守！','LOST!'),FAC[2].d,18);tone(180,.25,'sawtooth',.05,.6);shake=6;}else tone(300,.1,'square',.025,.8);}}
function stepDots(dt){const sp=96;for(const d of dots){if(d.dead)continue;d.wob+=dt*8;const dx=d.tgt.x-d.x,dy=d.tgt.y-d.y,dd=Math.hypot(dx,dy);if(dd<d.tgt.r*.75){d.dead=true;arrive(d);continue;}d.x+=dx/dd*sp*dt;d.y+=dy/dd*sp*dt;}
 // opposing streams clash
 for(let i=0;i<dots.length;i++){const a=dots[i];if(a.dead)continue;for(let j=i+1;j<dots.length;j++){const b=dots[j];if(b.dead||b.owner===a.owner)continue;if(Math.abs(a.x-b.x)<6&&Math.abs(a.y-b.y)<6){const m=Math.min(a.val,b.val);a.val-=m;b.val-=m;burst((a.x+b.x)/2,(a.y+b.y)/2,'#fff6d8',4,80);if(a.val<=0)a.dead=true;if(b.val<=0)b.dead=true;if(a.dead)break;}}}
 dots=dots.filter(d=>!d.dead);}
function grow(dt){for(const c of castles){const capV=cap(c);if(c.troops<capV){c.troops=Math.min(capV,c.troops+(c.owner===0?.16:.55+c.size*.42)*dt);}else if(c.troops>capV+.5)c.troops-=Math.min(c.troops-capV,dt*1.5);c.pulse=Math.max(0,c.pulse-dt*2.5);c.flash=Math.max(0,c.flash-dt*4);}}
function aiThink(f){const mine=castles.filter(c=>c.owner===f);if(!mine.length)return;const m=MAPS[mapIdx];let bestPlan=null;
 for(const t of castles){if(t.owner===f)continue;const incoming=dots.reduce((a,d)=>a+(d.tgt===t?(d.owner===f?-d.val:(d.owner===t.owner?d.val:-d.val)):0),0);const need=t.troops+incoming+2+(t.owner?cap(t)*.02*8:0);
  const srcs=mine.filter(c=>c.troops>=m.aiMin).sort((a,b)=>dist(a,t)-dist(b,t)).slice(0,3);let sum=0;const used=[];for(const s of srcs){sum+=Math.floor(s.troops/2)*(1-dist(s,t)/900);used.push(s);if(sum>need*1.15)break;}
  if(sum<=need*1.15)continue;const d=used.reduce((a,s)=>a+dist(s,t),0)/used.length;const score=t.size*14-d/14-need*.6+(t.owner===0?6:t.owner===1?4:0);if(!bestPlan||score>bestPlan.score)bestPlan={score,t,used};}
 if(bestPlan){for(const s of bestPlan.used)send(s,bestPlan.t,f);return;}
 // reinforce: rear castle sends to the most threatened own castle
 if(mine.length>1){const front=mine.map(c=>({c,th:castles.filter(o=>o.owner!==f&&o.owner!==0).reduce((a,o)=>Math.min(a,dist(o,c)),1e9)})).sort((a,b)=>a.th-b.th);const rear=front[front.length-1].c,fr=front[0].c;if(rear!==fr&&rear.troops>cap(rear)*.8)send(rear,fr,f);}}
function update(dt){mapTime+=dt;totalTime+=dt;grow(dt);emit(dt);stepDots(dt);const m=MAPS[mapIdx];
 for(const f of[2,3]){aiT[f]-=dt;if(aiT[f]<=0){aiT[f]=m.ai*rand(.8,1.2);aiThink(f);}}
 const own=castles.filter(c=>c.owner===1).length,myDots=dots.some(d=>d.owner===1)||streams.some(s=>s.owner===1);
 if(own===castles.length){win();}else if(own===0&&!myDots){lose();}}
function win(){phase='mapwin';const t=Math.floor(mapTime);if(!prog.best[mapIdx]||t<prog.best[mapIdx])prog.best[mapIdx]=t;prog.cleared=Math.max(prog.cleared,mapIdx+1);save('banner-rush-progress',prog);if(mapIdx===2)phase='won';chord([523,659,784,1046],.1);for(let i=0;i<6;i++)setTimeout(()=>burst(rand(60,390),rand(150,600),FAC[1].c,36,220),i*150);drag=null;selected=null;}
function lose(){phase='lost';drag=null;selected=null;tone(220,.35,'sawtooth',.05,.5);setTimeout(()=>tone(150,.45,'sawtooth',.05,.5),220);}
function nextMap(){if(phase==='mapwin')setupMap(mapIdx+1);}
function retryMap(){if(phase==='lost')setupMap(mapIdx);}
function newRun(){totalTime=0;setupMap(0);}

/* ---------- rendering ---------- */
function drawBg(){ctx.fillStyle='#ece3cc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e3d8bb';for(let y=70;y<H;y+=46)for(let x=(y/46%2)*23;x<W;x+=46){ctx.beginPath();ctx.arc(x,y,1.6,0,Math.PI*2);ctx.fill();}
 for(const d of decor){if(d.hide)continue;ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.s,d.s);if(d.k==='tree'){circ(0,4,8,'rgba(80,60,30,.12)');circ(0,-2,9,'#a9c48a');circ(-3,-5,5,'#bcd59c');}else{ctx.fillStyle='#cfc4a8';ctx.beginPath();ctx.moveTo(-8,4);ctx.lineTo(-3,-6);ctx.lineTo(5,-4);ctx.lineTo(9,4);ctx.closePath();ctx.fill();}ctx.restore();}}
function drawRoads(){ctx.lineCap='round';for(const [a,b] of edges){const A=castles[a],B=castles[b];ctx.strokeStyle='#d8caa6';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.strokeStyle='#f6efdc';ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([]);}}
function drawCastle(c){const f=FAC[c.owner],p=c.pulse,s=1+Math.sin(p*Math.PI)*.12;ctx.save();ctx.translate(c.x,c.y);ctx.scale(s,s);
 ctx.beginPath();ctx.ellipse(0,c.r*.75,c.r*1.05,c.r*.35,0,0,Math.PI*2);ctx.fillStyle='rgba(70,50,20,.16)';ctx.fill();
 // crenellated wall ring
 const n=8+c.size*2;ctx.fillStyle=f.d;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+artTime*.0;ctx.save();ctx.rotate(a);ctx.fillRect(-4,-c.r-5,8,8);ctx.restore();}
 circ(0,0,c.r,f.d);circ(0,0,c.r-3,f.c);circ(0,0,c.r-9,'#fffaf0');
 if((selected===c)||(drag&&drag.srcs.includes(c))){ctx.strokeStyle='#fffaf0';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.lineDashOffset=-artTime*30;ctx.beginPath();ctx.arc(0,0,c.r+10,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
 if(c.flash>0){ctx.globalAlpha=c.flash*.5;circ(0,0,c.r,'#fff');ctx.globalAlpha=1;}
 // banner
 ctx.strokeStyle='#6b5a40';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-c.r+2);ctx.lineTo(0,-c.r-22);ctx.stroke();const wv=Math.sin(artTime*5+c.x)*3;ctx.fillStyle=f.c;ctx.beginPath();ctx.moveTo(0,-c.r-22);ctx.quadraticCurveTo(10,-c.r-24+wv,20,-c.r-19+wv);ctx.lineTo(13,-c.r-15+wv*.5);ctx.lineTo(20,-c.r-10+wv);ctx.quadraticCurveTo(10,-c.r-13+wv,0,-c.r-12);ctx.closePath();ctx.fill();
 // size pips
 for(let i=0;i<c.size;i++)circ((i-(c.size-1)/2)*8,c.r-5,2.2,'#fffaf0');
 txt(String(Math.floor(c.troops)),0,1,c.size===3?20:17,f.d,'center',c.r*1.7,900);ctx.restore();}
function drawDots(){for(const d of dots){const col=FAC[d.owner].c,r=d.val>1?3.6:2.8;circ(d.x+d.ny*Math.sin(d.wob)*1.2,d.y-d.nx*Math.sin(d.wob)*1.2,r+1,FAC[d.owner].d);circ(d.x+d.ny*Math.sin(d.wob)*1.2,d.y-d.nx*Math.sin(d.wob)*1.2,r,col);}}
function drawDrag(){if(!drag||!drag.moved)return;const tgt=castleAt(drag);for(const s of drag.srcs){const tx=tgt?tgt.x:drag.x,ty=tgt?tgt.y:drag.y,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);if(d<s.r+4)continue;const nx=dx/d,ny=dy/d,ex=tx-nx*(tgt?tgt.r+6:0),ey=ty-ny*(tgt?tgt.r+6:0);ctx.strokeStyle='rgba(61,123,240,.85)';ctx.lineWidth=5;ctx.setLineDash([10,7]);ctx.lineDashOffset=-artTime*40;ctx.beginPath();ctx.moveTo(s.x+nx*s.r,s.y+ny*s.r);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#3d7bf0';ctx.beginPath();ctx.moveTo(ex+nx*4,ey+ny*4);ctx.lineTo(ex-nx*12-ny*8,ey-ny*12+nx*8);ctx.lineTo(ex-nx*12+ny*8,ey-ny*12-nx*8);ctx.fill();}
 if(tgt&&!drag.srcs.includes(tgt)){const amt=drag.srcs.reduce((a,s)=>a+Math.floor(s.troops/2),0);otxt((tgt.owner===1?'+':'⚔ ')+amt,tgt.x,tgt.y-tgt.r-34,16,tgt.owner===1?FAC[1].d:'#7a2a1a');}}
function drawFx(dt){for(const r of rings){r.life-=dt;ctx.save();ctx.globalAlpha=clamp(r.life*1.8,0,1);ctx.strokeStyle=r.col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,20+(1-r.life/.6)*40,0,Math.PI*2);ctx.stroke();ctx.restore();}rings=rings.filter(r=>r.life>0);
 for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;ctx.globalAlpha=clamp(p.life/p.max,0,1);circ(p.x,p.y,p.size,p.col);}ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);if(parts.length>500)parts.splice(0,parts.length-500);
 for(const f of floats){f.life-=dt*.8;f.y-=dt*30;ctx.save();ctx.globalAlpha=clamp(f.life*2,0,1);otxt(f.s,clamp(f.x,50,400),f.y,f.size*(f.life>.85?1+(f.life-.85)*2:1),f.col);ctx.restore();}floats=floats.filter(f=>f.life>0);}
function drawHud(){rr(10,8,430,50,18,'rgba(255,250,236,.92)','#d8caa6',2);const m=MAPS[mapIdx];
 txt(T('第 '+(mapIdx+1)+'/3 图','MAP '+(mapIdx+1)+'/3'),26,24,12,'#8f8778','left',120,800);txt(m.n[zh?0:1],26,42,17,'#2b2620','left',150,900);
 txt(fmt(mapTime),225,33,22,'#2b2620','center',100,900);
 const pb=prog.best[mapIdx];txt(pb?T('最快 ','Best ')+fmt(pb):T('未通关','Uncleared'),362,33,12,'#8f8778','right',110,700);
 rr(384,15,46,36,12,'rgba(60,40,20,.08)');ctx.strokeStyle='#5a4a30';ctx.fillStyle='#5a4a30';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(394,28);ctx.lineTo(400,28);ctx.lineTo(407,22);ctx.lineTo(407,42);ctx.lineTo(400,36);ctx.lineTo(394,36);ctx.closePath();ctx.fill();
 if(muted){ctx.beginPath();ctx.moveTo(412,26);ctx.lineTo(421,38);ctx.moveTo(421,26);ctx.lineTo(412,38);ctx.stroke();}else{ctx.beginPath();ctx.arc(408,32,7,-.8,.8);ctx.stroke();ctx.beginPath();ctx.arc(408,32,12,-.8,.8);ctx.stroke();}
 // power bar
 const tot=[0,0,0,0],cnt=[0,0,0,0];for(const c of castles){tot[c.owner]+=c.troops;cnt[c.owner]++;}for(const d of dots)tot[d.owner]+=d.val;const sum=tot.reduce((a,b)=>a+b,0)||1;
 rr(10,748,430,42,16,'rgba(255,250,236,.92)','#d8caa6',2);let x=22;const bw=406;for(const f of[1,2,3,0]){const w=bw*tot[f]/sum;if(w>0){ctx.fillStyle=FAC[f].c;ctx.fillRect(x,758,w,8);x+=w;}}
 let lx=22;for(const f of[1,2,3]){circ(lx+5,778,5,FAC[f].c);txt(FAC[f].n[zh?0:1]+' '+cnt[f],lx+14,778,11,cnt[f]?'#2b2620':'#b9b1a2','left',120,800);lx+=140;}
 if(hint&&mapIdx===0&&mapTime<14&&sendCount<2){const a=clamp(Math.min(mapTime,14-mapTime),0,1);ctx.save();ctx.globalAlpha=a;rr(40,690,370,44,22,'rgba(43,38,32,.85)');txt(T('从蓝色城堡拖到另一座城堡，派出一半兵力','Drag from a blue castle to another to send half'),225,712,13,'#fffaf0','center',350,800);ctx.restore();
  const c0=castles[6]||castles[1],s0=castles[0],k=(artTime%1.8)/1.8,e=k*k*(3-2*k),hx=s0.x+(c0.x-s0.x)*e,hy=s0.y+(c0.y-s0.y)*e;ctx.save();ctx.globalAlpha=a*.9;circ(hx,hy,12,'rgba(43,38,32,.35)');circ(hx,hy,7,'#fffaf0');ctx.restore();}}
function fmt(t){t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function drawBanner(dt){if(!banner)return;banner.life-=dt;const k=banner.life,a=clamp(k*2.5,0,1),s=k>1.5?1+(k-1.5)*1.5:1;ctx.save();ctx.globalAlpha=a;ctx.translate(225,96);ctx.scale(s,s);rr(-150,-20,300,40,20,'#2b2620');txt(banner.s,0,1,18,'#fffaf0','center',280,900);ctx.restore();if(banner.life<=0)banner=null;}
function panel(title,col,lines,btn,btn2){ctx.fillStyle='rgba(43,38,32,.55)';ctx.fillRect(0,0,W,H);rr(36,230,378,320,28,'#fffaf0','#d8caa6',3);rr(36,230,378,64,[28,28,0,0],col);otxt(title,225,263,26,'#fffaf0',col===FAC[2].c?FAC[2].d:FAC[1].d);
 lines.forEach((l,i)=>txt(l,225,330+i*30,15,i?'#8f8778':'#2b2620','center',340,i?700:800));button(95,440,260,58,btn,col===FAC[2].c?FAC[2].c:FAC[1].c,'#fff',Math.sin(artTime*5)*.025);if(btn2)txt(btn2,225,522,13,'#8f8778','center',260,800);}
function drawTitle(){drawBg();const demo=[[110,250,2,2],[340,250,2,3],[225,420,3,0],[225,590,2,1]];ctx.lineCap='round';for(const [a,b] of[[0,2],[1,2],[2,3]]){const A=demo[a],B=demo[b];ctx.strokeStyle='#d8caa6';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
 for(let i=0;i<14;i++){const k=((artTime*.35+i/14)%1),x=225,y=590-170*k;circ(x+Math.sin(i)*4,y,3.4,FAC[1].d);circ(x+Math.sin(i)*4,y,2.6,FAC[1].c);}
 for(const [x,y,s,o] of demo)drawCastle({x,y,size:s,owner:o,troops:o?30:16,r:20+s*6,pulse:0,flash:0});
 otxt(T('旗争','BANNER'),225,108,54,'#2b2620','#fffaf0');otxt(T('城堡争夺战','RUSH'),225,162,zh?34:54,FAC[1].c,'#fffaf0');
 rr(34,640,382,56,18,'rgba(255,250,236,.92)','#d8caa6',2);txt(T('目标：拖动派兵，占领地图上的每一座城堡。','Goal: drag to send troops and capture every castle.'),225,668,14,'#2b2620','center',360,800);
 button(105,712,240,58,T('开始征战','START'),FAC[1].c,'#fff',Math.sin(artTime*4)*.03);
 txt(T('已通关 ','Cleared ')+prog.cleared+'/3',225,784,12,'#8f8778','center',200,700);
 rr(384,15,46,36,12,'rgba(60,40,20,.08)');txt(muted?'♪×':'♪',407,33,20,'#5a4a30');}

/* ---------- loop ---------- */
function frame(ts){const raw=lastTs?Math.min((ts-lastTs)/1000,.05):0;lastTs=ts;artTime+=raw;
 if(phase==='play'){let left=raw*timeScale;while(left>0){const s=Math.min(left,.025);update(s);left-=s;if(phase!=='play')break;}}
 ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);
 if(phase==='title'){drawTitle();}
 else{ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake=Math.max(0,shake-raw*30);}drawBg();drawRoads();drawDots();for(const c of castles)drawCastle(c);drawDrag();drawFx(raw);ctx.restore();drawHud();drawBanner(raw);
  if(phase==='mapwin')panel(T('胜利！','VICTORY!'),FAC[1].c,[T('你的旗帜插遍了','Every castle flies your banner'),T('用时 ','Time ')+fmt(mapTime)+'  ·  '+T('派兵 ','Orders ')+sendCount],T('下一张地图 →','NEXT MAP →'));
  if(phase==='won')panel(T('一统三境！','REALMS UNITED!'),FAC[1].c,[T('三张地图全部征服','All three maps conquered'),T('总用时 ','Total time ')+fmt(totalTime)],T('再来一局 ↻','PLAY AGAIN ↻'),T('最快纪录已保存','Best times saved'));
  if(phase==='lost')panel(T('旗帜倒下了','BANNERS FALLEN'),FAC[2].c,[T('你失去了所有城堡','You lost every castle'),T('提示：集中兵力，先拿中立城堡','Tip: mass up and grab neutrals first')],T('重试本图 ↻','RETRY MAP ↻'));}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- input ---------- */
function pos(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}
function castleAt(p){let best=null,bd=1e9;for(const c of castles){const d=Math.hypot(p.x-c.x,p.y-c.y);if(d<c.r+14&&d<bd){bd=d;best=c;}}return best;}
function start(){if(phase!=='title')return;newRun();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();const p=pos(e);
 if(inR(p,380,8,56,50)){muted=!muted;save('banner-rush-muted',muted);if(!muted)tone(660);return;}
 if(phase==='title'){if(inR(p,105,712,240,58))start();return;}
 if(phase==='mapwin'){if(inR(p,95,440,260,58))nextMap();return;}
 if(phase==='won'){if(inR(p,95,440,260,58))newRun();return;}
 if(phase==='lost'){if(inR(p,95,440,260,58))retryMap();return;}
 if(phase!=='play')return;const c=castleAt(p);
 if(selected&&c&&c!==selected){if(send(selected,c,1)){}selected=null;return;}
 if(c&&c.owner===1){drag={srcs:[c],x:p.x,y:p.y,sx:p.x,sy:p.y,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}tone(700,.04);return;}
 selected=null;});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.x=p.x;drag.y=p.y;if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>12)drag.moved=true;const c=castleAt(p);if(c&&c.owner===1&&!drag.srcs.includes(c)&&Math.hypot(p.x-c.x,p.y-c.y)<c.r){drag.srcs.push(c);c.pulse=.6;tone(760,.04);}});
function endDrag(e,cancel){if(!drag)return;const d=drag;drag=null;if(cancel||phase!=='play')return;const p=pos(e),c=castleAt(p);
 if(!d.moved){selected=selected===d.srcs[0]?null:d.srcs[0];return;}
 if(!c)return;let sent=0;for(const s of d.srcs)if(s!==c&&send(s,c,1))sent++;if(!sent&&d.srcs.length>1&&d.srcs.includes(c)){}}
cv.addEventListener('pointerup',e=>endDrag(e));cv.addEventListener('pointercancel',e=>endDrag(e,true));
window.addEventListener('blur',()=>{drag=null;lastTs=0;});
document.addEventListener('visibilitychange',()=>{drag=null;lastTs=0;});

 state:()=>({phase,map:mapIdx,mapTime,castles:castles.map(c=>({k:c.k,x:c.x,y:c.y,owner:c.owner,troops:Math.floor(c.troops),size:c.size})),dots:dots.length,progress:prog}),
 start,restart:newRun,next:nextMap,retry:retryMap,send:(a,b)=>send(castles[a],castles[b],1),
 setTimeScale:v=>{timeScale=v},debugWin:()=>{if(phase==='play'){for(const c of castles)c.owner=1;}},debugLose:()=>{if(phase==='play'){for(const c of castles)if(c.owner===1)c.owner=2;dots=dots.filter(d=>d.owner!==1);streams=streams.filter(s=>s.owner!==1);}}};
