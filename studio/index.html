    <script>
      // Standalone defaults to Dark; embedded (embed=1) defaults to System and follows
      // the host until the user picks a theme. Resolve before paint; main.tsx binds live changes.
      const embedded = new URLSearchParams(location.search).get("embed") === "1";
      let preference = embedded ? "system" : "dark";
      try {
        const prefs = JSON.parse(localStorage.getItem("hf-studio-ui-preferences") || "{}");
        const saved = embedded ? prefs?.embeddedTheme : prefs?.theme;
        if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
      } catch (e) {}
      document.documentElement.dataset.themePreference = preference;
      let theme = preference;
      if (preference === "system")
        theme = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
      if (theme === "light") document.documentElement.dataset.theme = "paper";
      else delete document.documentElement.dataset.theme;
      const chromeColor = document.querySelector('meta[name="theme-color"]');
      if (chromeColor) chromeColor.content = chromeColor.dataset[theme];
    </script>
    <script>
      (() => {
        // Apply synchronous desktop chrome insets before first paint so macOS traffic lights
        // and Windows/Linux window controls never overlap the header on boot or reload.
        const bridge = window.__OPENMOTION_DESKTOP__;
        if (!bridge || typeof bridge.getChromeState !== "function") return;
        const hint = (navigator.platform || "") + " " + (navigator.userAgent || "");
        const fallbackPlatform = /Mac/i.test(hint) ? "darwin" : /Win/i.test(hint) ? "win32" : "linux";
        const chrome = bridge.initialChrome || {
          platform: fallbackPlatform,
          titleBarStyle: fallbackPlatform === "darwin" ? "hiddenInset" : fallbackPlatform === "win32" ? "hiddenOverlay" : "custom",
          insetLeft: fallbackPlatform === "darwin" ? 84 : 0,
          insetRight: fallbackPlatform === "win32" ? 138 : fallbackPlatform === "linux" ? 132 : 0,
          titleBarHeight: 46,
          fullscreen: false,
        };
        const root = document.documentElement;
        root.dataset.desktop = "true";
        root.dataset.desktopPlatform = chrome.platform;
        root.dataset.desktopTitlebar = chrome.titleBarStyle;
        root.dataset.desktopFullscreen = chrome.fullscreen ? "true" : "false";
        root.style.setProperty("--om-desktop-inset-left", chrome.insetLeft + "px");
        root.style.setProperty("--om-desktop-inset-right", chrome.insetRight + "px");
        root.style.setProperty("--om-desktop-titlebar-height", (chrome.titleBarHeight || 46) + "px");
      })();
    </script>
