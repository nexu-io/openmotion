<!doctype html>
<!--
  OpenDesign Desktop Splash
  Embeds the OpenDesign startup wordmark WebGL reveal shader (1705x291 artwork),
  adapted for light/dark themes and configured to play strictly once before
  settling on the static wordmark.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>OpenDesign</title>
    <style>
      :root,
      html[data-theme="light"] {
        --sp-bg: #f8f8f6;
        --sp-surface: #ffffff;
        --sp-surface-subtle: #ededeb;
        --sp-border: rgba(18, 22, 26, 0.11);
        --sp-text: #1b1d1f;
        --sp-muted: #727a82;
        --sp-step: #9aa2a8;
        --sp-track: rgba(18, 22, 26, 0.1);
        --sp-fill: #007106;
        --sp-cursor: #007106;
        --sp-sweep-edge: #00a80b;
        --sp-sweep-core: #58ff5e;
        --sp-accent: #007106;
        --sp-accent-ink: #ffffff;
        --sp-accent-soft: rgba(0, 113, 6, 0.1);
        --sp-danger: #dc2626;
        --sp-danger-bg: #fef2f2;
        --sp-danger-border: rgba(220, 38, 38, 0.28);
      }

      html[data-theme="dark"] {
        --sp-bg: #141517;
        --sp-surface: #1d1f22;
        --sp-surface-subtle: #25282c;
        --sp-border: rgba(255, 255, 255, 0.11);
        --sp-text: #eef0ed;
        --sp-muted: #8f969c;
        --sp-step: #6e757b;
        --sp-track: rgba(255, 255, 255, 0.1);
        --sp-fill: #58ff5e;
        --sp-cursor: #58ff5e;
        --sp-sweep-edge: #2ee639;
        --sp-sweep-core: #d4ffca;
        --sp-accent: #007106;
        --sp-accent-ink: #ffffff;
        --sp-accent-soft: rgba(135, 234, 92, 0.14);
        --sp-danger: #f87171;
        --sp-danger-bg: rgba(220, 38, 38, 0.14);
        --sp-danger-border: rgba(248, 113, 113, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sp-bg);
        color: var(--sp-text);
        font-family: "Albert Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 140ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      body[data-leaving="true"] {
        opacity: 0;
      }

      /* Invisible drag strip at top + quiet close button */
      .om-drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 46px;
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 14px;
        z-index: 20;
      }

      .om-close-btn {
        -webkit-app-region: no-drag;
        appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--sp-muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        font-size: 17px;
        line-height: 1;
        opacity: 0.4;
        transition: opacity 140ms ease, background 140ms ease, color 140ms ease;
      }

      .om-close-btn:hover {
        opacity: 1;
        background: var(--sp-surface-subtle);
        color: var(--sp-text);
      }

      html[data-embedded="true"] .om-close-btn {
        display: none;
      }

      /* Center stage: keeps the wordmark dead-center during boot */
      .om-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0 32px;
        transition: transform 320ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      #splash-logo {
        position: relative;
        height: min(40px, 14vw);
        width: auto;
        aspect-ratio: 1705 / 291;
        flex-shrink: 0;
      }

      #splash-logo canvas,
      #splash-logo img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        transition: opacity 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      /* The WebGL canvas only carries the one-off reveal. Once it settles, the
         vector artwork takes over so the wordmark stays sharp at any scale. */
      #splash-logo img {
        opacity: 0;
        user-select: none;
      }

      /* Fade the vector in over the still-opaque canvas, then drop the canvas.
         Fading both at once dips the wordmark to ~75% brightness mid-way. */
      #splash-logo canvas {
        transition-delay: 160ms;
      }

      html[data-logo-static="true"] #splash-logo img {
        opacity: 1;
      }

      html[data-logo-static="true"] #splash-logo canvas {
        opacity: 0;
      }

      /* Boot progress bar & step counter */
      .boot-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        pointer-events: none;
        transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      body[data-mode="signin"] .boot-footer,
      body[data-mode="error"] .boot-footer {
        opacity: 0;
        visibility: hidden;
      }

      .boot-progress {
        position: relative;
        width: 184px;
        height: 2.5px;
        border-radius: 999px;
        background: var(--sp-track);
        overflow: hidden;
      }

      .boot-progress-fill {
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: var(--sp-fill);
        opacity: 0.85;
        transition: width 320ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .boot-progress-fill[data-indeterminate="true"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 42%;
        animation: od-progress-slide 1.35s cubic-bezier(0.45, 0, 0.25, 1) infinite;
        will-change: transform;
      }

      @keyframes od-progress-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      .boot-stage {
        color: var(--sp-muted);
        font-size: 13px;
        line-height: 1.4;
        letter-spacing: 0.01em;
        text-align: center;
        transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .boot-stage-step {
        color: var(--sp-step);
        font-variant-numeric: tabular-nums;
        margin-right: 8px;
      }

      .boot-stage-step:empty {
        display: none;
      }

      .boot-dots .dot {
        display: inline-block;
        animation: boot-dot 1.4s cubic-bezier(0.23, 1, 0.32, 1) infinite;
      }
      .boot-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots .dot:nth-child(3) { animation-delay: 0.4s; }

      body[data-mode="welcome"] .boot-dots {
        display: none;
      }

      @keyframes boot-dot {
        0%, 60%, 100% { opacity: 0.25; }
        30% { opacity: 1; }
      }

      /* Integrated sign-in / error panels */
      .om-panel {
        width: min(440px, calc(100vw - 48px));
        margin-top: 32px;
        padding: 20px 22px;
        border-radius: 16px;
        border: 1px solid var(--sp-border);
        background: var(--sp-surface);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
        display: none;
        flex-direction: column;
        gap: 14px;
        -webkit-app-region: no-drag;
      }

      body[data-mode="signin"] .om-panel-signin {
        display: flex;
      }

      body[data-mode="error"] .om-panel-error {
        display: flex;
      }

      .om-panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .om-panel-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--sp-text);
      }

      .om-panel-sub {
        margin: 4px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--sp-muted);
      }

      .om-pill {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--sp-accent-soft);
        color: var(--sp-accent);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      html[data-theme="dark"] .om-pill {
        color: #87ea5c;
      }

      .om-auth-pending {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--sp-surface-subtle);
        border: 1px solid var(--sp-border);
        font-size: 12.5px;
      }

      .om-auth-pending[data-visible="true"] {
        display: flex;
      }

      .om-auth-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--sp-text);
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--sp-surface);
        border: 1px solid var(--sp-border);
      }

      .om-signin-error {
        display: none;
        margin: 0;
        padding: 9px 12px;
        border-radius: 10px;
        background: var(--sp-danger-bg);
        border: 1px solid var(--sp-danger-border);
        color: var(--sp-danger);
        font-size: 12.5px;
        line-height: 1.45;
      }

      .om-signin-error[data-visible="true"] {
        display: block;
      }

      .om-btn-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .om-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 15px;
        border-radius: 10px;
        border: 1px solid var(--sp-border);
        background: var(--sp-surface-subtle);
        color: var(--sp-text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 140ms ease, background 140ms ease, border-color 140ms ease;
      }

      .om-btn:hover {
        opacity: 0.92;
      }

      .om-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .om-btn-primary {
        background: var(--sp-accent);
        border-color: var(--sp-accent);
        color: var(--sp-accent-ink);
      }

      .om-error-detail {
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--sp-danger-bg);
        border: 1px solid var(--sp-danger-border);
        color: var(--sp-danger);
        font-size: 12.5px;
        line-height: 1.5;
        word-break: break-word;
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        .om-stage,
        #splash-logo,
        #splash-logo canvas,
        #splash-logo img,
        .boot-footer,
        .boot-stage,
        .boot-progress-fill,
        .boot-dots .dot,
        .om-panel {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-mode="booting">
    <div class="om-drag-bar">
      <button type="button" class="om-close-btn" id="close-splash-btn" aria-label="Close window">&times;</button>
    </div>

    <main class="om-stage" role="status" aria-live="polite">
      <div id="splash-logo" role="img" aria-label="OpenDesign">
        <canvas id="splash-canvas" aria-hidden="true"></canvas>
        <img id="splash-logo-img" alt="" aria-hidden="true" draggable="false" />
      </div>

      <!-- Integrated OpenDesign Sign-In Panel -->
      <section class="om-panel om-panel-signin" id="view-signin" aria-label="Sign in to OpenDesign">
        <div class="om-panel-head">
          <div>
            <h1 class="om-panel-title" id="signin-title">Sign in to OpenDesign</h1>
            <p class="om-panel-sub" id="signin-subtitle">
              Connect your account for cloud AI models, live web deployment, and MCP sharing.
            </p>
          </div>
          <span class="om-pill" id="signin-agents-pill" hidden></span>
        </div>

        <div class="om-auth-pending" id="signin-pending-box" data-visible="false">
          <div>
            <strong id="signin-pending-label">Complete sign-in in your browser…</strong>
            <div class="om-panel-sub" style="margin-top: 2px;">Waiting for OAuth confirmation</div>
          </div>
          <span class="om-auth-code" id="signin-user-code" hidden></span>
        </div>

        <p class="om-signin-error" id="signin-error" data-visible="false"></p>

        <div class="om-btn-row">
          <button type="button" class="om-btn om-btn-primary" id="signin-start-btn">
            Sign in with OpenDesign
          </button>
          <a class="om-btn" id="signin-browser-link" href="#" target="_blank" rel="noreferrer" hidden>
            Open browser
          </a>
          <button type="button" class="om-btn" id="signin-cancel-btn" hidden>
            Cancel
          </button>
          <button type="button" class="om-btn" id="continue-local-btn">
            Continue locally
          </button>
        </div>
      </section>

      <!-- Startup Recovery Panel -->
      <section class="om-panel om-panel-error" id="error-panel" aria-label="Startup error">
        <h1 class="om-panel-title">Could not start OpenDesign</h1>
        <p class="om-error-detail" id="error-detail">OpenDesign Cloud could not be reached.</p>
        <div class="om-btn-row">
          <button type="button" class="om-btn om-btn-primary" id="retry-btn">
            Retry startup
          </button>
          <button type="button" class="om-btn" id="export-logs-btn">
            Export logs
          </button>
        </div>
      </section>
    </main>

    <div class="boot-footer" id="boot-footer">
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-fill" id="boot-progress-fill" data-indeterminate="true" data-pct="0"></div>
      </div>
      <div class="boot-stage" id="boot-stage">
        <span class="boot-stage-step" id="boot-stage-step"></span><span id="boot-stage-text">Connecting to OpenDesign Cloud</span><span class="boot-dots" aria-hidden="true"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
      </div>
    </div>

        let sizedW = 0;
        let sizedH = 0;
        let observedPx = null;
        let resizeObserver = null;

        function buildThemedLogoSrc(theme) {
          const ink = theme === 'dark' ? '#eef0ed' : '#202020';
          const svg = atob(LOGO_SVG_B64).replace(/#202020/g, ink);
          return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function hostSize() {
          if (!logoHost) return { w: 0, h: 0 };
          const rect = logoHost.getBoundingClientRect();
          return {
            w: Math.max(1, Math.round(rect.width)),
            h: Math.max(1, Math.round(rect.height)),
          };
        }

        function rasteriseWordmark(pxW, pxH) {
          wordCanvas.width = pxW;
          wordCanvas.height = pxH;
          const ctx = wordCanvas.getContext('2d');
          if (!ctx) return;
          ctx.clearRect(0, 0, pxW, pxH);
          if (wordImg.naturalWidth > 0 && wordImg.naturalHeight > 0) {
            const s = Math.min(pxW / wordImg.naturalWidth, pxH / wordImg.naturalHeight);
            const dw = wordImg.naturalWidth * s;
            const dh = wordImg.naturalHeight * s;
            ctx.drawImage(wordImg, (pxW - dw) / 2, (pxH - dh) / 2, dw, dh);
          }
        }

        function compileShader(type, source) {
          if (!gl) return null;
          const shader = gl.createShader(type);
          if (!shader) return null;
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error('[splash] shader compile failed:', gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
          }
          return shader;
        }

        function uploadTexture() {
          if (!gl || !texture) return;
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, wordCanvas);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        }

        function renderWebglFrame(timeSec, enterTime) {
          if (!gl || !sizedW) return;
          gl.uniform1f(uni.time, timeSec);
          gl.uniform1f(uni.enterTime, enterTime);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
        }

        function cancelLogoRaf() {
          if (raf) {
            cancelAnimationFrame(raf);
            raf = 0;
          }
        }

        function renderSettledWordmark() {
          playedOnce = true;
          cancelLogoRaf();
          document.documentElement.setAttribute('data-logo-static', 'true');
        }

        function resizeLogo() {
          if (!logoCanvas || !gl || playedOnce) return;
          const size = hostSize();
          if (size.w < 2 || size.h < 2) return;
          const ratio = window.devicePixelRatio || 1;
          const pxW = Math.max(1, observedPx ? observedPx.w : Math.round(size.w * ratio));
          const pxH = Math.max(1, observedPx ? observedPx.h : Math.round(size.h * ratio));
          if (pxW === sizedW && pxH === sizedH) return;
          sizedW = pxW;
          sizedH = pxH;
          logoCanvas.width = pxW;
          logoCanvas.height = pxH;
          gl.viewport(0, 0, pxW, pxH);
          rasteriseWordmark(pxW, pxH);
          uploadTexture();
          gl.uniform2f(uni.resolution, pxW, pxH);
        }

        function frame() {
          raf = 0;
          if (stopped) return;
          if (freezeStatic || motionQuery.matches || playedOnce) {
            renderSettledWordmark();
            return;
          }
          if (document.hidden) return;
          resizeLogo();
          if (!sizedW) {
            raf = requestAnimationFrame(frame);
            return;
          }
          const now = performance.now();
          const elapsed = elapsedBeforePause + (now - playStartTime) / 1000;
          if (elapsed >= ENTRANCE_SECONDS) {
            // Play strictly once: settle onto the finished static wordmark and stop rAF.
            renderSettledWordmark();
            return;
          }
          const x = Math.min(1, Math.max(0, elapsed / ENTRANCE_SECONDS));
          const eased = 1 - (1 - x) * (1 - x);
          const enterTime = MIN_ENTER + eased * (1 - MIN_ENTER);
          renderWebglFrame((now - startTime) / 1000, enterTime);
          raf = requestAnimationFrame(frame);
        }

        function syncLogoAnimationState() {
          const shouldBeStatic = stopped || freezeStatic || motionQuery.matches || playedOnce;
          document.documentElement.setAttribute('data-logo-static', shouldBeStatic ? 'true' : 'false');
          if (stopped) {
            cancelLogoRaf();
            return;
          }
          if (freezeStatic || motionQuery.matches) {
            renderSettledWordmark();
            return;
          }
          if (document.hidden) {
            if (!playedOnce && raf) {
              elapsedBeforePause += (performance.now() - playStartTime) / 1000;
              cancelLogoRaf();
            }
            return;
          }
          if (gl && !playedOnce && !raf) {
            playStartTime = performance.now();
            raf = requestAnimationFrame(frame);
          }
        }

        function startLogoWebgl() {
          if (!logoHost || !logoCanvas || stopped) return;
          try {
            gl = logoCanvas.getContext('webgl', {
              alpha: true,
              antialias: false,
              premultipliedAlpha: true,
              preserveDrawingBuffer: true,
            });
          } catch {
            gl = null;
          }
          if (!gl) {
            renderSettledWordmark();
            return;
          }
          const vs = compileShader(gl.VERTEX_SHADER, VERT);
          const fs = compileShader(gl.FRAGMENT_SHADER, FRAG);
          if (!vs || !fs) {
            gl = null;
            renderSettledWordmark();
            return;
          }
          program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          gl.deleteShader(vs);
          gl.deleteShader(fs);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('[splash] program link failed:', gl.getProgramInfoLog(program));
            gl = null;
            renderSettledWordmark();
            return;
          }
          gl.useProgram(program);

          vertexBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 0, 1, -1, 0, -1, 1, 0, -1, 1, 0, 1, -1, 0, 1, 1, 0]),
            gl.STATIC_DRAW,
          );
          const loc = gl.getAttribLocation(program, 'position');
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

          uni = {};
          const names = [
            'src', 'resolution', 'offset', 'time', 'enterTime', 'leaveTime',
            'mode', 'speed', 'delay', 'width', 'accent', 'accent2', 'baseCol',
            'mouse', 'hover', 'spot',
          ];
          for (let i = 0; i < names.length; i++) {
            uni[names[i]] = gl.getUniformLocation(program, names[i]);
          }
          uni.trail = gl.getUniformLocation(program, 'trail[0]');
          uni.trailW = gl.getUniformLocation(program, 'trailW[0]');

          texture = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0);
          gl.uniform1i(uni.src, 0);

          gl.uniform2f(uni.offset, 0, 0);
          gl.uniform1f(uni.leaveTime, 0);
          gl.uniform1i(uni.mode, 3);
          gl.uniform1f(uni.speed, 1);
          gl.uniform1f(uni.delay, 0);
          gl.uniform1f(uni.width, 0.2);
          gl.uniform3f(uni.accent, ACCENT[0], ACCENT[1], ACCENT[2]);
          gl.uniform3f(uni.accent2, ACCENT2[0], ACCENT2[1], ACCENT2[2]);
          gl.uniform3f(uni.baseCol, BASE[0], BASE[1], BASE[2]);
          gl.uniform2f(uni.mouse, -10000, -10000);
          gl.uniform1f(uni.hover, 0);
          gl.uniform1f(uni.spot, 0.28);
          const trail = new Float32Array(TRAIL * 2);
          for (let t = 0; t < trail.length; t++) trail[t] = -10000;
          gl.uniform2fv(uni.trail, trail);
          gl.uniform1fv(uni.trailW, new Float32Array(TRAIL));

          sizedW = 0;
          sizedH = 0;
          resizeLogo();
          if (playedOnce || freezeStatic || motionQuery.matches) {
            renderSettledWordmark();
            return;
          }
          startTime = performance.now();
          playStartTime = startTime;
          if (!document.hidden) {
            raf = requestAnimationFrame(frame);
          }
        }

        function onContextLost(event) {
          event.preventDefault();
          cancelLogoRaf();
          gl = null;
          sizedW = 0;
          sizedH = 0;
          renderSettledWordmark();
        }

        function onContextRestored() {
          if (stopped) return;
          startLogoWebgl();
        }

        if (logoCanvas) {
          logoCanvas.addEventListener('webglcontextlost', onContextLost);
          logoCanvas.addEventListener('webglcontextrestored', onContextRestored);
        }
        window.addEventListener('resize', resizeLogo);
        if (typeof ResizeObserver === 'function' && logoCanvas) {
          resizeObserver = new ResizeObserver((entries) => {
            const entry = entries[entries.length - 1];
            const box = entry && entry.devicePixelContentBoxSize && entry.devicePixelContentBoxSize[0];
            if (box) observedPx = { w: box.inlineSize, h: box.blockSize };
            resizeLogo();
          });
          try {
            resizeObserver.observe(logoCanvas, { box: 'device-pixel-content-box' });
          } catch {
            resizeObserver.observe(logoCanvas);
          }
        }

        wordImg.onload = startLogoWebgl;
        wordImg.onerror = () => {
          console.error('[splash] logo failed to load');
        };
        const logoSrc = buildThemedLogoSrc(activeTheme);
        wordImg.src = logoSrc;
        if (logoImg) logoImg.src = logoSrc;

        function onReducedMotionChange() {
          syncLogoAnimationState();
        }

        function onVisibilityChange() {
          syncLogoAnimationState();
        }

        syncLogoAnimationState();
        motionQuery.addEventListener('change', onReducedMotionChange);
        document.addEventListener('visibilitychange', onVisibilityChange);

        window.__omSplashStopLogo = function () {
          stopped = true;
          cancelLogoRaf();
          syncLogoAnimationState();
        };
        window.__odSplashStopLogo = window.__omSplashStopLogo;

        // Splash stage + integrated sign-in / recovery controller
        const STEP_META = {
          engine: { index: 1, total: 4, pct: 25 },
          agents: { index: 2, total: 4, pct: 55 },
          account: { index: 3, total: 4, pct: 80 },
          ready: { index: 4, total: 4, pct: 100 },
        };

        let pollTimer = null;
        const desktop = () => window.__OPENMOTION_DESKTOP__;

        function renderAccountState(account) {
          const startBtn = document.getElementById('signin-start-btn');
          const cancelBtn = document.getElementById('signin-cancel-btn');
          const browserLink = document.getElementById('signin-browser-link');
          const pendingBox = document.getElementById('signin-pending-box');
          const pendingLabel = document.getElementById('signin-pending-label');
          const codeEl = document.getElementById('signin-user-code');
          const errEl = document.getElementById('signin-error');
          const titleEl = document.getElementById('signin-title');

          if (!account) return;
          const isAuth = account.state === 'authorizing';
          const isExpired = account.state === 'reauth-required';

          if (titleEl) {
            titleEl.textContent = isExpired
              ? 'OpenDesign sign-in expired'
              : isAuth
                ? 'Authorizing OpenDesign…'
                : 'Sign in to OpenDesign';
          }

          if (pendingBox) pendingBox.dataset.visible = isAuth ? 'true' : 'false';
          if (pendingLabel) {
            pendingLabel.textContent = account.syncing
              ? 'Authorized — syncing your workspace…'
              : 'Complete sign-in in your browser…';
          }

          if (codeEl) {
            if (account.userCode && !account.syncing) {
              codeEl.textContent = account.userCode;
              codeEl.hidden = false;
            } else {
              codeEl.hidden = true;
            }
          }

          if (startBtn) {
            startBtn.hidden = isAuth;
            startBtn.disabled = false;
            startBtn.textContent = isExpired ? 'Sign in again' : 'Sign in with OpenDesign';
          }
          if (cancelBtn) cancelBtn.hidden = !isAuth || Boolean(account.syncing);
          if (browserLink) {
            if (isAuth && account.authorizationUrl && !account.syncing) {
              browserLink.href = account.authorizationUrl;
              browserLink.hidden = false;
            } else {
              browserLink.hidden = true;
            }
          }
          if (errEl) {
            if (!isAuth && account.error) {
              errEl.textContent = account.error;
              errEl.dataset.visible = 'true';
            } else {
              errEl.dataset.visible = 'false';
            }
          }

          if (isAuth && !pollTimer) {
            pollTimer = setInterval(async () => {
              const api = desktop();
              if (!api?.splashRefreshAccount) return;
              try {
                const updated = await api.splashRefreshAccount();
                if (updated?.state === 'signed-in') {
                  clearInterval(pollTimer);
                  pollTimer = null;
                  window.__updateDesktopSplash({
                    step: 'ready',
                    mode: 'welcome',
                    status: 'Opening OpenDesign Studio',
                    account: {
                      state: 'signed-in',
                      name: updated.user?.name,
                      email: updated.user?.email,
                      plan: updated.plan,
                    },
                  });
                  setTimeout(() => {
                    void api.splashContinueToStudio?.();
                  }, 480);
                } else {
                  renderAccountState(updated);
                }
              } catch {
                // Retry on next tick.
              }
            }, 1300);
          } else if (!isAuth && pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
        }

        window.__updateDesktopSplash = function (progress) {
          if (!progress || typeof progress !== 'object') return;
          const mode = progress.mode || (progress.errorMessage ? 'error' : 'booting');
          document.body.setAttribute('data-mode', mode);

          const shouldFreeze = mode === 'signin' || mode === 'error';
          if (shouldFreeze !== freezeStatic) {
            freezeStatic = shouldFreeze;
            syncLogoAnimationState();
          }

          const meta = STEP_META[progress.step] || STEP_META.ready;
          const fillEl = document.getElementById('boot-progress-fill');
          const stepEl = document.getElementById('boot-stage-step');
          const textEl = document.getElementById('boot-stage-text');

          if (fillEl) {
            if (mode === 'booting' && progress.step === 'ready') {
              fillEl.setAttribute('data-indeterminate', 'true');
            } else {
              fillEl.removeAttribute('data-indeterminate');
              const prevPct = Number(fillEl.dataset.pct || '0');
              const nextPct = mode === 'booting' ? Math.max(prevPct, meta.pct) : meta.pct;
              fillEl.dataset.pct = String(nextPct);
              fillEl.style.width = nextPct + '%';
            }
          }
          if (stepEl) {
            stepEl.textContent = mode === 'booting' && progress.step === 'ready' ? '' : (meta.index + '/' + meta.total);
          }
          if (textEl) {
            let cleanLabel = String(progress.status || 'Connecting to OpenDesign Cloud').replace(/[.…]+$/, '');
            if (mode === 'welcome' && progress.account) {
              const who = progress.account.name || progress.account.email || '';
              if (who) cleanLabel = 'Welcome back, ' + who;
            }
            textEl.textContent = cleanLabel;
          }

          if (mode === 'signin') {
            const pill = document.getElementById('signin-agents-pill');
            if (pill && typeof progress.agentsCount === 'number' && progress.agentsCount > 0) {
              pill.textContent = progress.agentsCount + ' local AI agent' + (progress.agentsCount === 1 ? '' : 's') + ' ready';
              pill.hidden = false;
            }
            renderAccountState(progress.account || { state: 'signed-out' });
          }

          if (mode === 'error') {
            const detail = document.getElementById('error-detail');
            if (detail && progress.errorMessage) {
              detail.textContent = progress.errorMessage;
            }
          }
        };

        document.getElementById('close-splash-btn')?.addEventListener('click', () => {
          window.close();
        });

        document.getElementById('retry-btn')?.addEventListener('click', () => {
          const fillEl = document.getElementById('boot-progress-fill');
          if (fillEl) {
            fillEl.setAttribute('data-indeterminate', 'true');
          }
          window.__updateDesktopSplash({
            step: 'ready',
            mode: 'booting',
            status: 'Connecting to OpenDesign Cloud',
          });
          const localPage = window.__OPENMOTION_LOCAL_PAGE__;
          const api = desktop();
          if (localPage?.retryStartup) {
            void localPage.retryStartup();
          } else if (api?.splashRetry) {
            void api.splashRetry();
          } else {
            window.location.hash = 'retry=' + Date.now();
          }
        });

        document.getElementById('export-logs-btn')?.addEventListener('click', async () => {
          const localPage = window.__OPENMOTION_LOCAL_PAGE__;
          const api = desktop();
          if (localPage?.exportDiagnostics) {
            await localPage.exportDiagnostics();
          } else if (api?.exportLogs) {
            await api.exportLogs();
          }
        });

        document.getElementById('continue-local-btn')?.addEventListener('click', () => {
          const api = desktop();
          if (api?.splashContinueToStudio) {
            void api.splashContinueToStudio();
          }
        });

        document.getElementById('signin-start-btn')?.addEventListener('click', async () => {
          const btn = document.getElementById('signin-start-btn');
          const api = desktop();
          if (!api?.splashStartSignIn) return;
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Opening browser…';
          }
          try {
            const account = await api.splashStartSignIn();
            renderAccountState(account);
          } catch (err) {
            renderAccountState({
              state: 'signed-out',
              error: err instanceof Error ? err.message : String(err),
            });
          }
        });

        document.getElementById('signin-cancel-btn')?.addEventListener('click', async () => {
          const api = desktop();
          if (!api?.splashCancelSignIn) return;
          try {
            const account = await api.splashCancelSignIn();
            renderAccountState(account);
          } catch {
            // Ignore cancel failure.
          }
        });

        document.getElementById('signin-browser-link')?.addEventListener('click', event => {
          const link = document.getElementById('signin-browser-link');
          const href = link?.getAttribute('href');
          const api = desktop();
          if (href && href !== '#' && api?.openExternal) {
            event.preventDefault();
            void api.openExternal(href);
          }
        });

        function teardownSplashResources() {
          stopped = true;
          cancelLogoRaf();
          if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
          if (resizeObserver) {
            resizeObserver.disconnect();
            resizeObserver = null;
          }
          window.removeEventListener('resize', resizeLogo);
          if (logoCanvas) {
            logoCanvas.removeEventListener('webglcontextlost', onContextLost);
            logoCanvas.removeEventListener('webglcontextrestored', onContextRestored);
          }
          if (gl) {
            if (texture) gl.deleteTexture(texture);
            if (vertexBuffer) gl.deleteBuffer(vertexBuffer);
            if (program) gl.deleteProgram(program);
            texture = null;
            vertexBuffer = null;
            program = null;
            gl = null;
          }
          motionQuery.removeEventListener('change', onReducedMotionChange);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          syncLogoAnimationState();
        }

        window.addEventListener('pagehide', teardownSplashResources);
        window.addEventListener('beforeunload', teardownSplashResources);
      })();
    </script>
  </body>
</html>
