<!doctype html>
<!--
  OpenDesign Desktop Splash
  100% pure vector inline SVG OpenDesign wordmark (exact paths from
  packages/design-system/brand/loading-wordmark.svg) with GPU-composited
  emerald light-sweep shimmer — zero WebGL / bitmap rasterization blur.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>OpenDesign</title>
    <style>
      :root,
      html[data-theme="light"] {
        --sp-bg: #f8f8f6;
        --sp-surface: #ffffff;
        --sp-surface-subtle: #ededeb;
        --sp-border: rgba(18, 22, 26, 0.11);
        --sp-text: #1b1d1f;
        --sp-muted: #727a82;
        --sp-step: #9aa2a8;
        --sp-track: rgba(18, 22, 26, 0.1);
        --sp-fill: #007106;
        --sp-cursor: #007106;
        --sp-sweep-edge: #00a80b;
        --sp-sweep-core: #58ff5e;
        --sp-accent: #007106;
        --sp-accent-ink: #ffffff;
        --sp-accent-soft: rgba(0, 113, 6, 0.1);
        --sp-danger: #dc2626;
        --sp-danger-bg: #fef2f2;
        --sp-danger-border: rgba(220, 38, 38, 0.28);
      }

      html[data-theme="dark"] {
        --sp-bg: #141517;
        --sp-surface: #1d1f22;
        --sp-surface-subtle: #25282c;
        --sp-border: rgba(255, 255, 255, 0.11);
        --sp-text: #eef0ed;
        --sp-muted: #8f969c;
        --sp-step: #6e757b;
        --sp-track: rgba(255, 255, 255, 0.1);
        --sp-fill: #58ff5e;
        --sp-cursor: #58ff5e;
        --sp-sweep-edge: #2ee639;
        --sp-sweep-core: #d4ffca;
        --sp-accent: #007106;
        --sp-accent-ink: #ffffff;
        --sp-accent-soft: rgba(135, 234, 92, 0.14);
        --sp-danger: #f87171;
        --sp-danger-bg: rgba(220, 38, 38, 0.14);
        --sp-danger-border: rgba(248, 113, 113, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sp-bg);
        color: var(--sp-text);
        font-family: "Albert Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 140ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      body[data-leaving="true"] {
        opacity: 0;
      }

      /* Invisible drag strip at top + quiet close button */
      .om-drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 46px;
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 14px;
        z-index: 20;
      }

      .om-close-btn {
        -webkit-app-region: no-drag;
        appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--sp-muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        font-size: 17px;
        line-height: 1;
        opacity: 0.4;
        transition: opacity 140ms ease, background 140ms ease, color 140ms ease;
      }

      .om-close-btn:hover {
        opacity: 1;
        background: var(--sp-surface-subtle);
        color: var(--sp-text);
      }

      html[data-embedded="true"] .om-close-btn {
        display: none;
      }

      /* Center stage: keeps the vector wordmark dead-center during boot */
      .om-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0 32px;
        transition: transform 320ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      #splash-logo {
        position: relative;
        height: 44px;
        width: auto;
        aspect-ratio: 1705 / 291;
        flex-shrink: 0;
        animation: od-logo-enter 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .od-wordmark-svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        shape-rendering: geometricPrecision;
      }

      .od-base-ink {
        fill: var(--sp-text);
      }

      .od-cursor-arrow {
        fill: var(--sp-cursor);
        transform-box: fill-box;
        transform-origin: center;
        animation: od-cursor-breathe 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .od-shimmer-band {
        animation: od-shimmer-sweep 1.85s cubic-bezier(0.42, 0, 0.22, 1) infinite;
        will-change: transform;
      }

      html[data-logo-static="true"] .od-shimmer-band,
      html[data-logo-static="true"] .od-cursor-arrow {
        animation: none !important;
      }

      html[data-logo-static="true"] .od-shimmer-band {
        opacity: 0;
      }

      @keyframes od-logo-enter {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes od-shimmer-sweep {
        0% {
          transform: translateX(-720px);
        }
        100% {
          transform: translateX(2180px);
        }
      }

      @keyframes od-cursor-breathe {
        0%,
        100% {
          opacity: 0.92;
        }
        50% {
          opacity: 1;
        }
      }

      /* Boot progress bar & step counter */
      .boot-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        pointer-events: none;
        transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      body[data-mode="signin"] .boot-footer,
      body[data-mode="error"] .boot-footer {
        opacity: 0;
        visibility: hidden;
      }

      .boot-progress {
        position: relative;
        width: 184px;
        height: 2.5px;
        border-radius: 999px;
        background: var(--sp-track);
        overflow: hidden;
      }

      .boot-progress-fill {
        width: 38%;
        height: 100%;
        border-radius: 999px;
        background: var(--sp-fill);
        opacity: 0.85;
        transition: width 320ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .boot-progress-fill[data-indeterminate="true"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 42%;
        animation: od-progress-slide 1.35s cubic-bezier(0.45, 0, 0.25, 1) infinite;
        will-change: transform;
      }

      @keyframes od-progress-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      .boot-stage {
        color: var(--sp-muted);
        font-size: 13px;
        line-height: 1.4;
        letter-spacing: 0.01em;
        text-align: center;
        transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .boot-stage-step {
        color: var(--sp-step);
        font-variant-numeric: tabular-nums;
        margin-right: 8px;
      }

      .boot-stage-step:empty {
        display: none;
      }

      .boot-dots .dot {
        display: inline-block;
        animation: boot-dot 1.4s cubic-bezier(0.23, 1, 0.32, 1) infinite;
      }
      .boot-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots .dot:nth-child(3) { animation-delay: 0.4s; }

      body[data-mode="welcome"] .boot-dots {
        display: none;
      }

      @keyframes boot-dot {
        0%, 60%, 100% { opacity: 0.25; }
        30% { opacity: 1; }
      }

      /* Integrated sign-in / error panels */
      .om-panel {
        width: min(440px, calc(100vw - 48px));
        margin-top: 32px;
        padding: 20px 22px;
        border-radius: 16px;
        border: 1px solid var(--sp-border);
        background: var(--sp-surface);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
        display: none;
        flex-direction: column;
        gap: 14px;
        -webkit-app-region: no-drag;
      }

      body[data-mode="signin"] .om-panel-signin {
        display: flex;
      }

      body[data-mode="error"] .om-panel-error {
        display: flex;
      }

      .om-panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .om-panel-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--sp-text);
      }

      .om-panel-sub {
        margin: 4px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--sp-muted);
      }

      .om-pill {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--sp-accent-soft);
        color: var(--sp-accent);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      html[data-theme="dark"] .om-pill {
        color: #87ea5c;
      }

      .om-auth-pending {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--sp-surface-subtle);
        border: 1px solid var(--sp-border);
        font-size: 12.5px;
      }

      .om-auth-pending[data-visible="true"] {
        display: flex;
      }

      .om-auth-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--sp-text);
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--sp-surface);
        border: 1px solid var(--sp-border);
      }

      .om-signin-error {
        display: none;
        margin: 0;
        padding: 9px 12px;
        border-radius: 10px;
        background: var(--sp-danger-bg);
        border: 1px solid var(--sp-danger-border);
        color: var(--sp-danger);
        font-size: 12.5px;
        line-height: 1.45;
      }

      .om-signin-error[data-visible="true"] {
        display: block;
      }

      .om-btn-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .om-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 15px;
        border-radius: 10px;
        border: 1px solid var(--sp-border);
        background: var(--sp-surface-subtle);
        color: var(--sp-text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 140ms ease, background 140ms ease, border-color 140ms ease;
      }

      .om-btn:hover {
        opacity: 0.92;
      }

      .om-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .om-btn-primary {
        background: var(--sp-accent);
        border-color: var(--sp-accent);
        color: var(--sp-accent-ink);
      }

      .om-error-detail {
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--sp-danger-bg);
        border: 1px solid var(--sp-danger-border);
        color: var(--sp-danger);
        font-size: 12.5px;
        line-height: 1.5;
        word-break: break-word;
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        .om-stage,
        #splash-logo,
        .od-shimmer-band,
        .od-cursor-arrow,
        .boot-footer,
        .boot-stage,
        .boot-progress-fill,
        .boot-dots .dot,
        .om-panel {
          animation: none !important;
          transition: none !important;
        }
        .od-shimmer-band {
          opacity: 0 !important;
        }
      }
    </style>
  </head>
  <body data-mode="booting">

      <button type="button" class="om-close-btn" id="close-splash-btn" aria-label="Close window">&times;</button>

            <mask id="od-wordmark-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1705" height="291">
              <use href="#od-wordmark-shapes" fill="#ffffff" />
            </mask>

            <linearGradient id="od-shimmer-grad" x1="0%" y1="0%" x2="100%" y2="20%">
              <stop offset="0%" stop-color="var(--sp-sweep-edge)" stop-opacity="0" />
              <stop offset="32%" stop-color="var(--sp-sweep-edge)" stop-opacity="0.72" />
              <stop offset="50%" stop-color="var(--sp-sweep-core)" stop-opacity="0.96" />
              <stop offset="68%" stop-color="var(--sp-sweep-edge)" stop-opacity="0.72" />
              <stop offset="100%" stop-color="var(--sp-sweep-edge)" stop-opacity="0" />
            </linearGradient>

          <!-- Crisp vector base wordmark -->

            d="M137.934 215.04L94.3119 100.247C92.9002 96.5317 96.5286 92.8895 100.219 94.3172L215.067 138.749C219.793 140.578 218.491 147.633 213.427 147.633H146.769V213.4C146.769 218.499 139.744 219.804 137.934 215.04Z"
          />

          <!-- Pure vector masked emerald light sweep (infinite Retina sharpness) -->
          <g mask="url(#od-wordmark-mask)">
            <g class="od-shimmer-band">
              <polygon points="0,-60 440,-60 320,351 -120,351" fill="url(#od-shimmer-grad)" />
            </g>
          </g>

      </div>

      <!-- Integrated OpenDesign Sign-In Panel -->
      <section class="om-panel om-panel-signin" id="view-signin" aria-label="Sign in to OpenDesign">
        <div class="om-panel-head">
          <div>
            <h1 class="om-panel-title" id="signin-title">Sign in to OpenDesign</h1>
            <p class="om-panel-sub" id="signin-subtitle">
              Connect your account for cloud AI models, live web deployment, and MCP sharing.
            </p>
          </div>
          <span class="om-pill" id="signin-agents-pill" hidden></span>
        </div>

        <div class="om-auth-pending" id="signin-pending-box" data-visible="false">
          <div>
            <strong id="signin-pending-label">Complete sign-in in your browser…</strong>
            <div class="om-panel-sub" style="margin-top: 2px;">Waiting for OAuth confirmation</div>
          </div>
          <span class="om-auth-code" id="signin-user-code" hidden></span>
        </div>

        <p class="om-signin-error" id="signin-error" data-visible="false"></p>

        <div class="om-btn-row">
          <button type="button" class="om-btn om-btn-primary" id="signin-start-btn">
            Sign in with OpenDesign
          </button>
          <a class="om-btn" id="signin-browser-link" href="#" target="_blank" rel="noreferrer" hidden>
            Open browser
          </a>
          <button type="button" class="om-btn" id="signin-cancel-btn" hidden>
            Cancel
          </button>
          <button type="button" class="om-btn" id="continue-local-btn">
            Continue locally
          </button>
        </div>
      </section>

      <!-- Startup Recovery Panel -->
      <section class="om-panel om-panel-error" id="error-panel" aria-label="Startup error">
        <h1 class="om-panel-title">Could not start OpenDesign</h1>
        <p class="om-error-detail" id="error-detail">OpenDesign Cloud could not be reached.</p>
        <div class="om-btn-row">
          <button type="button" class="om-btn om-btn-primary" id="retry-btn">
            Retry startup
          </button>
          <button type="button" class="om-btn" id="export-logs-btn">
            Export logs
          </button>
        </div>
      </section>
    </main>

    <div class="boot-footer" id="boot-footer">
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-fill" id="boot-progress-fill" data-indeterminate="true" data-pct="0"></div>
      </div>
      <div class="boot-stage" id="boot-stage">
        <span class="boot-stage-step" id="boot-stage-step"></span><span id="boot-stage-text">Connecting to OpenDesign Cloud</span><span class="boot-dots" aria-hidden="true"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get('embedded') === '1') {
          document.documentElement.setAttribute('data-embedded', 'true');
        }
        const requestedTheme = params.get('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const activeTheme = requestedTheme === 'light' || requestedTheme === 'dark'
          ? requestedTheme
          : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', activeTheme);

        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        let stopped = false;
        let freezeStatic = false;

        function syncLogoAnimationState() {
          const isStatic = stopped || freezeStatic || document.hidden || motionQuery.matches;
          document.documentElement.setAttribute('data-logo-static', isStatic ? 'true' : 'false');
        }

        function onReducedMotionChange() {
          syncLogoAnimationState();
        }

        function onVisibilityChange() {
          syncLogoAnimationState();
        }

        syncLogoAnimationState();
        motionQuery.addEventListener('change', onReducedMotionChange);
        document.addEventListener('visibilitychange', onVisibilityChange);

        window.__omSplashStopLogo = function () {
          stopped = true;
          syncLogoAnimationState();
        };

        // Splash stage + integrated sign-in / recovery controller
        const STEP_META = {
          engine: { index: 1, total: 4, pct: 25 },
          agents: { index: 2, total: 4, pct: 55 },
          account: { index: 3, total: 4, pct: 80 },
          ready: { index: 4, total: 4, pct: 100 },
        };

        let pollTimer = null;
        const desktop = () => window.__OPENMOTION_DESKTOP__;

        function renderAccountState(account) {
          const startBtn = document.getElementById('signin-start-btn');
          const cancelBtn = document.getElementById('signin-cancel-btn');
          const browserLink = document.getElementById('signin-browser-link');
          const pendingBox = document.getElementById('signin-pending-box');
          const pendingLabel = document.getElementById('signin-pending-label');
          const codeEl = document.getElementById('signin-user-code');
          const errEl = document.getElementById('signin-error');
          const titleEl = document.getElementById('signin-title');

          if (!account) return;
          const isAuth = account.state === 'authorizing';
          const isExpired = account.state === 'reauth-required';

          if (titleEl) {
            titleEl.textContent = isExpired
              ? 'OpenDesign sign-in expired'
              : isAuth
                ? 'Authorizing OpenDesign…'
                : 'Sign in to OpenDesign';
          }

          if (pendingBox) pendingBox.dataset.visible = isAuth ? 'true' : 'false';
          if (pendingLabel) {
            pendingLabel.textContent = account.syncing
              ? 'Authorized — syncing your workspace…'
              : 'Complete sign-in in your browser…';
          }

          if (codeEl) {
            if (account.userCode && !account.syncing) {
              codeEl.textContent = account.userCode;
              codeEl.hidden = false;
            } else {
              codeEl.hidden = true;
            }
          }

          if (startBtn) {
            startBtn.hidden = isAuth;
            startBtn.disabled = false;
            startBtn.textContent = isExpired ? 'Sign in again' : 'Sign in with OpenDesign';
          }
          if (cancelBtn) cancelBtn.hidden = !isAuth || Boolean(account.syncing);
          if (browserLink) {
            if (isAuth && account.authorizationUrl && !account.syncing) {
              browserLink.href = account.authorizationUrl;
              browserLink.hidden = false;
            } else {
              browserLink.hidden = true;
            }
          }
          if (errEl) {
            if (!isAuth && account.error) {
              errEl.textContent = account.error;
              errEl.dataset.visible = 'true';
            } else {
              errEl.dataset.visible = 'false';
            }
          }

          if (isAuth && !pollTimer) {
            pollTimer = setInterval(async () => {
              const api = desktop();
              if (!api?.splashRefreshAccount) return;
              try {
                const updated = await api.splashRefreshAccount();
                if (updated?.state === 'signed-in') {
                  clearInterval(pollTimer);
                  pollTimer = null;
                  window.__updateDesktopSplash({
                    step: 'ready',
                    mode: 'welcome',
                    status: 'Opening OpenDesign Studio',
                    account: {
                      state: 'signed-in',
                      name: updated.user?.name,
                      email: updated.user?.email,
                      plan: updated.plan,
                    },
                  });
                  setTimeout(() => {
                    void api.splashContinueToStudio?.();
                  }, 480);
                } else {
                  renderAccountState(updated);
                }
              } catch {
                // Retry on next tick.
              }
            }, 1300);
          } else if (!isAuth && pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
        }

        window.__updateDesktopSplash = function (progress) {
          if (!progress || typeof progress !== 'object') return;
          const mode = progress.mode || (progress.errorMessage ? 'error' : 'booting');
          document.body.setAttribute('data-mode', mode);

          const shouldFreeze = mode === 'signin' || mode === 'error';
          if (shouldFreeze !== freezeStatic) {
            freezeStatic = shouldFreeze;
            syncLogoAnimationState();
          }

          const meta = STEP_META[progress.step] || STEP_META.ready;
          const fillEl = document.getElementById('boot-progress-fill');
          const stepEl = document.getElementById('boot-stage-step');
          const textEl = document.getElementById('boot-stage-text');

          if (fillEl) {
            if (mode === 'booting' && progress.step === 'ready') {
              fillEl.setAttribute('data-indeterminate', 'true');
            } else {
              fillEl.removeAttribute('data-indeterminate');
              const prevPct = Number(fillEl.dataset.pct || '0');
              const nextPct = mode === 'booting' ? Math.max(prevPct, meta.pct) : meta.pct;
              fillEl.dataset.pct = String(nextPct);
              fillEl.style.width = nextPct + '%';
            }
          }
          if (stepEl) {
            stepEl.textContent = mode === 'booting' && progress.step === 'ready' ? '' : (meta.index + '/' + meta.total);
          }
          if (textEl) {
            let cleanLabel = String(progress.status || 'Connecting to OpenDesign Cloud').replace(/[.…]+$/, '');
            if (mode === 'welcome' && progress.account) {
              const who = progress.account.name || progress.account.email || '';
              if (who) cleanLabel = 'Welcome back, ' + who;
            }
            textEl.textContent = cleanLabel;
          }

          if (mode === 'signin') {
            const pill = document.getElementById('signin-agents-pill');
            if (pill && typeof progress.agentsCount === 'number' && progress.agentsCount > 0) {
              pill.textContent = progress.agentsCount + ' local AI agent' + (progress.agentsCount === 1 ? '' : 's') + ' ready';
              pill.hidden = false;
            }
            renderAccountState(progress.account || { state: 'signed-out' });
          }

          if (mode === 'error') {
            const detail = document.getElementById('error-detail');
            if (detail && progress.errorMessage) {
              detail.textContent = progress.errorMessage;
            }
          }
        };

        document.getElementById('close-splash-btn')?.addEventListener('click', () => {
          window.close();
        });

        document.getElementById('retry-btn')?.addEventListener('click', () => {
          const fillEl = document.getElementById('boot-progress-fill');
          if (fillEl) {
            fillEl.setAttribute('data-indeterminate', 'true');
          }
          window.__updateDesktopSplash({
            step: 'ready',
            mode: 'booting',
            status: 'Connecting to OpenDesign Cloud',
          });
          const localPage = window.__OPENMOTION_LOCAL_PAGE__;
          const api = desktop();
          if (localPage?.retryStartup) {
            void localPage.retryStartup();
          } else if (api?.splashRetry) {
            void api.splashRetry();
          } else {
            window.location.hash = 'retry=' + Date.now();
          }
        });

        document.getElementById('export-logs-btn')?.addEventListener('click', async () => {
          const localPage = window.__OPENMOTION_LOCAL_PAGE__;
          const api = desktop();
          if (localPage?.exportDiagnostics) {
            await localPage.exportDiagnostics();
          } else if (api?.exportLogs) {
            await api.exportLogs();
          }
        });

        document.getElementById('continue-local-btn')?.addEventListener('click', () => {
          const api = desktop();
          if (api?.splashContinueToStudio) {
            void api.splashContinueToStudio();
          }
        });

        document.getElementById('signin-start-btn')?.addEventListener('click', async () => {
          const btn = document.getElementById('signin-start-btn');
          const api = desktop();
          if (!api?.splashStartSignIn) return;
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Opening browser…';
          }
          try {
            const account = await api.splashStartSignIn();
            renderAccountState(account);
          } catch (err) {
            renderAccountState({
              state: 'signed-out',
              error: err instanceof Error ? err.message : String(err),
            });
          }
        });

        document.getElementById('signin-cancel-btn')?.addEventListener('click', async () => {
          const api = desktop();
          if (!api?.splashCancelSignIn) return;
          try {
            const account = await api.splashCancelSignIn();
            renderAccountState(account);
          } catch {
            // Ignore cancel failure.
          }
        });

        document.getElementById('signin-browser-link')?.addEventListener('click', event => {
          const link = document.getElementById('signin-browser-link');
          const href = link?.getAttribute('href');
          const api = desktop();
          if (href && href !== '#' && api?.openExternal) {
            event.preventDefault();
            void api.openExternal(href);
          }
        });

        function teardownSplashResources() {
          stopped = true;
          if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
          motionQuery.removeEventListener('change', onReducedMotionChange);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          syncLogoAnimationState();
        }

        window.addEventListener('pagehide', teardownSplashResources);
        window.addEventListener('beforeunload', teardownSplashResources);
      })();
    </script>
  </body>
</html>
