<!doctype html>
<!--
  OpenMotion Desktop Offline / Load-Failure Retry Page (K1 / K2).
  Self-contained page with opaque design-system tokens for light and dark
  color schemes, zero external dependencies, and universal host bridge actions.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>OpenDesign — Connection Unavailable</title>
    <style>
      :root {
        color-scheme: light dark;
        --rt-bg: #f4f4f4;
        --rt-surface: #ffffff;
        --rt-panel: #fafafa;
        --rt-hover: #ededed;
        --rt-border: #dbdbdb;
        --rt-border-strong: #bdbdbd;
        --rt-strong: #202020;
        --rt-text: #494949;
        --rt-muted: #5c5c5c;
        --rt-dim: #696969;
        --rt-focus: #848484;
        --rt-action: #121212;
        --rt-action-hover: #353535;
        --rt-on-action: #ffffff;
        --rt-danger: #c52b32;
        --rt-danger-soft: #fff1f1;
        --rt-toast-bg: #ffffff;
        --rt-toast-ink: #202020;
        --rt-shadow: 0 6px 24px rgb(28 27 26 / 7%), 0 2px 6px rgb(28 27 26 / 4%);
        --rt-font-sans: "Albert Sans", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        --rt-font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --rt-bg: #0c0d0e;
          --rt-surface: #202123;
          --rt-panel: #191a1b;
          --rt-hover: #36383a;
          --rt-border: #484b4d;
          --rt-border-strong: #737878;
          --rt-strong: #f7f8f5;
          --rt-text: #e6e8e4;
          --rt-muted: #c0c4bd;
          --rt-dim: #a9afa7;
          --rt-focus: #a0a69f;
          --rt-action: #f7f7f7;
          --rt-action-hover: #dbdbdb;
          --rt-on-action: #121212;
          --rt-danger: #ff9898;
          --rt-danger-soft: #472929;
          --rt-toast-bg: #292b2c;
          --rt-toast-ink: #f7f8f5;
          --rt-shadow: 0 6px 24px rgb(0 0 0 / 40%), 0 2px 6px rgb(0 0 0 / 25%);
        }
      }

      html[data-theme="dark"] {
        --rt-bg: #0c0d0e;
        --rt-surface: #202123;
        --rt-panel: #191a1b;
        --rt-hover: #36383a;
        --rt-border: #484b4d;
        --rt-border-strong: #737878;
        --rt-strong: #f7f8f5;
        --rt-text: #e6e8e4;
        --rt-muted: #c0c4bd;
        --rt-dim: #a9afa7;
        --rt-focus: #a0a69f;
        --rt-action: #f7f7f7;
        --rt-action-hover: #dbdbdb;
        --rt-on-action: #121212;
        --rt-danger: #ff9898;
        --rt-danger-soft: #472929;
        --rt-toast-bg: #292b2c;
        --rt-toast-ink: #f7f8f5;
        --rt-shadow: 0 6px 24px rgb(0 0 0 / 40%), 0 2px 6px rgb(0 0 0 / 25%);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--rt-bg);
        color: var(--rt-text);
        font-family: var(--rt-font-sans);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100dvh;
        overflow-y: auto;
        padding: 58px 24px 36px;
      }

      .rt-drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 46px;
        background: var(--rt-bg);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 8px;
        -webkit-app-region: drag;
        z-index: 10;
      }

      .rt-window-controls {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      .rt-win-btn {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--rt-muted);
        width: 32px;
        height: 30px;
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }

      .rt-win-btn:hover {
        background: var(--rt-hover);
        color: var(--rt-strong);
      }

      .rt-win-btn[data-action="close"]:hover {
        background: var(--rt-danger-soft);
        color: var(--rt-danger);
      }

      .rt-stage {
        width: 100%;
        max-width: 460px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .rt-wordmark {
        color: var(--rt-strong);
        height: 28px;
        width: auto;
        display: block;
      }

      .rt-card {
        width: 100%;
        padding: 28px;
        border-radius: 12px;
        background: var(--rt-surface);
        border: 1px solid var(--rt-border);
        box-shadow: var(--rt-shadow);
        display: flex;
        flex-direction: column;
        gap: 16px;
        -webkit-app-region: no-drag;
      }

      .rt-badge {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--rt-danger-soft);
        color: var(--rt-danger);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.25;
      }

      .rt-title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.01em;
        color: var(--rt-strong);
      }

      .rt-message {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--rt-muted);
      }

      .rt-detail {
        margin: 0;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--rt-panel);
        border: 1px solid var(--rt-border);
        color: var(--rt-dim);
        font-family: var(--rt-font-mono);
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      .rt-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .rt-btn {
        appearance: none;
        border: 1px solid var(--rt-border);
        border-radius: 8px;
        background: var(--rt-surface);
        color: var(--rt-strong);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        min-height: 36px;
        padding: 0 16px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 150ms ease, border-color 150ms ease, opacity 150ms ease;
      }

      .rt-btn:hover:not(:disabled) {
        background: var(--rt-hover);
        border-color: var(--rt-border-strong);
      }

      .rt-btn:focus-visible {
        outline: 2px solid var(--rt-focus);
        outline-offset: 2px;
      }

      .rt-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .rt-btn-primary {
        background: var(--rt-action);
        color: var(--rt-on-action);
        border-color: var(--rt-action);
      }

      .rt-btn-primary:hover:not(:disabled) {
        background: var(--rt-action-hover);
        border-color: var(--rt-action-hover);
      }

      .rt-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(8px);
        max-width: min(440px, calc(100vw - 32px));
        padding: 10px 14px;
        border-radius: 8px;
        background: var(--rt-toast-bg);
        color: var(--rt-toast-ink);
        border: 1px solid var(--rt-border);
        box-shadow: var(--rt-shadow);
        font-size: 13px;
        line-height: 1.4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease, transform 150ms ease;
        z-index: 30;
      }

      .rt-toast[data-visible="true"] {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .rt-btn,
        .rt-toast {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="rt-drag-bar">

        <button type="button" class="rt-win-btn" data-action="toggleMaximize" aria-label="Maximize window">&#x25A1;</button>
        <button type="button" class="rt-win-btn" data-action="close" aria-label="Close window">&#x00D7;</button>
      </div>
    </div>

      <section class="rt-card" aria-labelledby="retry-title">
        <span class="rt-badge" id="retry-badge">Offline or unreachable</span>
        <h1 class="rt-title" id="retry-title">Unable to load OpenDesign</h1>
        <p class="rt-message" id="retry-message">
          Check your internet connection or network proxy, then try reconnecting to OpenDesign Studio.
        </p>
        <p class="rt-detail" id="retry-detail" hidden></p>

        <div class="rt-actions">
          <button type="button" class="rt-btn rt-btn-primary" id="retry-btn">
            Retry
          </button>
          <button type="button" class="rt-btn" id="switch-env-btn" hidden>
            Switch environment
          </button>
          <button type="button" class="rt-btn" id="reset-env-btn" hidden>
            Reset to default Test
          </button>
          <button type="button" class="rt-btn" id="export-diagnostics-btn">
            Export diagnostics
          </button>
        </div>
      </section>
    </main>

    <div class="rt-toast" id="retry-toast" role="status" aria-live="polite" data-visible="false"></div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const requestedTheme = params.get('theme');
        if (requestedTheme === 'light' || requestedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', requestedTheme);
        }

        const windowControlsEl = document.getElementById('retry-window-controls');
        if (windowControlsEl && params.get('customWindowControls') === '1') {
          windowControlsEl.hidden = false;
          windowControlsEl.addEventListener('click', event => {
            const target = event.target instanceof Element ? event.target.closest('button[data-action]') : null;
            const action = target ? target.getAttribute('data-action') : null;
            if (!action) return;
            const bridge = window.__OPENMOTION_LOCAL_PAGE__;
            if (bridge && typeof bridge.windowControl === 'function') {
              void bridge.windowControl(action);
            }
          });
        }

        const badgeEl = document.getElementById('retry-badge');
        const titleEl = document.getElementById('retry-title');
        const messageEl = document.getElementById('retry-message');
        const detailEl = document.getElementById('retry-detail');
        const retryBtn = document.getElementById('retry-btn');
        const switchEnvBtn = document.getElementById('switch-env-btn');
        const resetEnvBtn = document.getElementById('reset-env-btn');
        const exportBtn = document.getElementById('export-diagnostics-btn');
        const toastEl = document.getElementById('retry-toast');
        let toastTimer = null;

        const isZh = (params.get('locale') || navigator.language || '').toLowerCase().startsWith('zh');
        if (switchEnvBtn && params.get('canSwitchEnv') === '1') {
          switchEnvBtn.hidden = false;
          if (isZh) switchEnvBtn.textContent = '切换测试环境';
          switchEnvBtn.addEventListener('click', async () => {
            try {
              const res = await window.__OPENMOTION_LOCAL_PAGE__?.openEnvironmentSwitcher?.();
              if (res && res.ok === false) {
                showToast(res.error?.message || (isZh ? '无法打开环境切换器。' : 'Could not open environment switcher.'));
              }
            } catch (error) {
              showToast(error instanceof Error ? error.message : String(error));
            }
          });
        }
        if (resetEnvBtn && params.get('canResetEnv') === '1') {
          resetEnvBtn.hidden = false;
          if (isZh) resetEnvBtn.textContent = '恢复默认 Test 环境';
          resetEnvBtn.addEventListener('click', async () => {
            resetEnvBtn.disabled = true;
            try {
              const res = await window.__OPENMOTION_LOCAL_PAGE__?.resetEnvironment?.();
              if (res && res.ok === false) {
                showToast(res.error?.message || (isZh ? '无法重置环境。' : 'Could not reset environment.'));
                resetEnvBtn.disabled = false;
              }
            } catch (error) {
              showToast(error instanceof Error ? error.message : String(error));
              resetEnvBtn.disabled = false;
            }
          });
        }
        let activeErrorCode = '';
        let retryInFlight = false;
        let onlineRetryTimer = null;

        function setTheme(theme) {
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        }
        window.__setDesktopTheme = setTheme;

        function showToast(text) {
          if (!toastEl) return;
          toastEl.textContent = String(text || '');
          toastEl.dataset.visible = 'true';
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toastEl.dataset.visible = 'false';
          }, 3200);
        }

        function setRetryError(info) {
          if (!info || typeof info !== 'object') return;
          if (typeof info.code === 'string') {
            activeErrorCode = info.code.trim();
          }
          if (typeof info.badge === 'string' && info.badge.trim() && badgeEl) {
            badgeEl.textContent = info.badge.trim();
          }
          if (typeof info.title === 'string' && info.title.trim() && titleEl) {
            titleEl.textContent = info.title.trim();
          }
          if (typeof info.message === 'string' && info.message.trim() && messageEl) {
            messageEl.textContent = info.message.trim();
          }
          if (detailEl) {
            const parts = [];
            if (typeof info.code === 'string' && info.code.trim()) {
              parts.push('Error: ' + info.code.trim());
            }
            if (typeof info.incident === 'string' && info.incident.trim()) {
              parts.push('Ref: ' + info.incident.trim());
            }
            if (typeof info.detail === 'string' && info.detail.trim()) {
              parts.push(info.detail.trim());
            }
            if (parts.length > 0) {
              detailEl.textContent = parts.join(' — ');
              detailEl.hidden = false;
            } else {
              detailEl.textContent = '';
              detailEl.hidden = true;
            }
          }
        }

        window.__setDesktopRetryError = setRetryError;

        const initialBadge = params.get('badge');
        const initialTitle = params.get('title');
        const initialCode = params.get('code');
        const initialMessage = params.get('message');
        const initialDetail = params.get('detail');
        const initialIncident = params.get('incident');
        if (initialBadge || initialTitle || initialCode || initialMessage || initialDetail || initialIncident) {
          setRetryError({
            badge: initialBadge || undefined,
            title: initialTitle || undefined,
            code: initialCode || undefined,
            message: initialMessage || undefined,
            detail: initialDetail || undefined,
            incident: initialIncident || undefined,
          });
        }

        async function triggerRetry() {
          if (retryInFlight) return;
          retryInFlight = true;
          if (retryBtn) {
            retryBtn.disabled = true;
            retryBtn.textContent = 'Retrying…';
          }
          try {
            if (window.__OPENMOTION_LOCAL_PAGE__?.retryStartup) {
              const result = await window.__OPENMOTION_LOCAL_PAGE__.retryStartup();
              if (result && result.ok === false) {
                showToast(result.error?.message || 'Could not reconnect yet.');
              }
            } else if (window.__OPENMOTION_HOST__?.invoke) {
              const result = await window.__OPENMOTION_HOST__.invoke('window', 'retryStartup');
              if (result && result.ok === false) {
                showToast(result.error?.message || 'Could not reconnect yet.');
              }
            } else if (window.__OPENMOTION_DESKTOP__?.retryDesktopStartup) {
              await window.__OPENMOTION_DESKTOP__.retryDesktopStartup();
            } else {
              window.location.reload();
            }
          } catch (error) {
            showToast(error instanceof Error ? error.message : 'Retry failed. Please try again.');
          } finally {
            retryInFlight = false;
            if (retryBtn) {
              retryBtn.disabled = false;
              retryBtn.textContent = 'Retry';
            }
          }
        }

        retryBtn?.addEventListener('click', () => {
          if (onlineRetryTimer) {
            clearTimeout(onlineRetryTimer);
            onlineRetryTimer = null;
          }
          void triggerRetry();
        });

        window.addEventListener('online', () => {
          const isNetworkError =
            !activeErrorCode ||
            activeErrorCode.startsWith('NET_') ||
            activeErrorCode === 'LOAD_FAILED';
          if (!isNetworkError || retryInFlight) return;
          showToast('Connection restored. Reconnecting…');
          if (onlineRetryTimer) clearTimeout(onlineRetryTimer);
          onlineRetryTimer = setTimeout(() => {
            onlineRetryTimer = null;
            void triggerRetry();
          }, 1200);
        });

        exportBtn?.addEventListener('click', async () => {
          exportBtn.disabled = true;
          try {
            if (window.__OPENMOTION_LOCAL_PAGE__?.exportDiagnostics) {
              const result = await window.__OPENMOTION_LOCAL_PAGE__.exportDiagnostics();
              if (result && result.ok) {
                const payload = result.data || {};
                if (payload.ok) {
                  showToast('Diagnostics exported.');
                } else if (payload.canceled) {
                  showToast('Diagnostics export canceled.');
                } else {
                  showToast(payload.error || 'Could not export diagnostics.');
                }
              } else if (result && result.error?.code === 'USER_DENIED') {
                showToast('Diagnostics export canceled.');
              } else {
                showToast(result?.error?.message || 'Could not export diagnostics.');
              }
            } else if (window.__OPENMOTION_HOST__?.invoke) {
              const result = await window.__OPENMOTION_HOST__.invoke('diagnostics', 'exportBundle');
              if (result && result.ok) {
                const payload = result.data || {};
                if (payload.ok) {
                  showToast('Diagnostics exported.');
                } else if (payload.canceled) {
                  showToast('Diagnostics export canceled.');
                } else {
                  showToast(payload.error || 'Could not export diagnostics.');
                }
              } else if (result && result.error?.code === 'USER_DENIED') {
                showToast('Diagnostics export canceled.');
              } else {
                showToast(result?.error?.message || 'Could not export diagnostics.');
              }
            } else if (window.__OPENMOTION_DESKTOP__?.exportDesktopLogs) {
              const result = await window.__OPENMOTION_DESKTOP__.exportDesktopLogs();
              if (result?.ok) {
                showToast('Diagnostics exported.');
              } else if (!result?.canceled) {
                showToast(result?.error || 'Could not export diagnostics.');
              }
            } else {
              showToast('Diagnostics export is unavailable in this window.');
            }
          } catch (error) {
            showToast(error instanceof Error ? error.message : 'Could not export diagnostics.');
          } finally {
            exportBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
