apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmotion-api
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: openmotion
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmotion-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmotion-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: openmotion
    spec:
      serviceAccountName: openmotion-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/nexu-io/openmotion-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WORKER_ROLE
              value: "api"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: NODE_ENV
            - name: APP_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: APP_PUBLIC_ORIGIN
            - name: PREVIEW_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: PREVIEW_PUBLIC_ORIGIN
                  optional: true
            - name: PREVIEW_TOKEN_TTL_SEC
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: PREVIEW_TOKEN_TTL_SEC
                  optional: true
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: PORT
            - name: BIND_HOST
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: BIND_HOST
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: DATABASE_URL
            - name: PG_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: PG_POOL_MAX
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: REDIS_URL
            - name: REDIS_CACHE_URL
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: REDIS_CACHE_URL
                  optional: true
            - name: REDIS_CACHE_TTL_SEC
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: REDIS_CACHE_TTL_SEC
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_PUBLIC_ENDPOINT
                  optional: true
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_BUCKET
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_FORCE_PATH_STYLE
            - name: S3_PRESIGN_PUT_TTL_SEC
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_PRESIGN_PUT_TTL_SEC
            - name: S3_PRESIGN_GET_TTL_SEC
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_PRESIGN_GET_TTL_SEC
            - name: S3_PRESIGN_CACHE_WINDOW_SEC
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_PRESIGN_CACHE_WINDOW_SEC
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
            - name: AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: AUTH_MODE
            - name: ALLOW_INSECURE_DEV_AUTH
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: ALLOW_INSECURE_DEV_AUTH
            - name: TRUST_PROXY_HOPS
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: TRUST_PROXY_HOPS
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: SESSION_SECRET
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_ISSUER
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: OIDC_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_CALLBACK_URL
                  optional: true
            - name: OIDC_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_SCOPES
            - name: OIDC_CLAIM_SUB
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_CLAIM_SUB
            - name: OIDC_CLAIM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_CLAIM_EMAIL
            - name: OIDC_CLAIM_NAME
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_CLAIM_NAME
            - name: OIDC_CLAIM_WORKSPACE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OIDC_CLAIM_WORKSPACE
                  optional: true
            - name: MCP_OAUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: MCP_OAUTH_MODE
            - name: MCP_OAUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: MCP_OAUTH_ISSUER
                  optional: true
            - name: MCP_MAX_BODY_BYTES
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: MCP_MAX_BODY_BYTES
            - name: MODEL_GATEWAY_MODE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: MODEL_GATEWAY_MODE
            - name: OPENDESIGN_API_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_API_URL
            - name: OPENDESIGN_LINK_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_LINK_URL
            - name: OPENDESIGN_S2S_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: OPENDESIGN_S2S_API_KEY
            - name: OPENDESIGN_ASR_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_ASR_URL
                  optional: true
            - name: OPENDESIGN_BILLING_SYNC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_BILLING_SYNC_ENABLED
            - name: ALLOW_DOH_FAKEIP_FALLBACK
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: ALLOW_DOH_FAKEIP_FALLBACK
            - name: HISTORY_COALESCE_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: HISTORY_COALESCE_WINDOW_MS
                  optional: true
            - name: SENTRY_WEB_DSN
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: SENTRY_WEB_DSN
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: SENTRY_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: SENTRY_RELEASE
                  optional: true
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: SENTRY_TRACES_SAMPLE_RATE
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openmotion-api
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: openmotion
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmotion-api
      app.kubernetes.io/component: api
