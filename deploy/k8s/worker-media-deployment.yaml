apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmotion-worker-media
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-worker-media
    app.kubernetes.io/component: worker-media
    app.kubernetes.io/part-of: openmotion
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: openmotion-worker-media
      app.kubernetes.io/component: worker-media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmotion-worker-media
        app.kubernetes.io/component: worker-media
        app.kubernetes.io/part-of: openmotion
    spec:
      serviceAccountName: openmotion-worker-media
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-media
          image: ghcr.io/nexu-io/openmotion-worker-media:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Least-privilege projection: NO OIDC_*, NO SESSION_SECRET, NO DEV_PAT.
          env:
            - name: WORKER_ROLE
              value: "media"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: DATABASE_URL
            - name: PG_POOL_MAX
              value: "10"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_PUBLIC_ENDPOINT
                  optional: true
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_BUCKET
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: S3_FORCE_PATH_STYLE
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
            - name: MODEL_GATEWAY_MODE
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: MODEL_GATEWAY_MODE
            - name: OPENDESIGN_API_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_API_URL
            - name: OPENDESIGN_LINK_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_LINK_URL
            - name: OPENDESIGN_S2S_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openmotion-secrets
                  key: OPENDESIGN_S2S_API_KEY
            - name: OPENDESIGN_ASR_URL
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_ASR_URL
                  optional: true
            - name: OPENDESIGN_BILLING_SYNC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENDESIGN_BILLING_SYNC_ENABLED
            - name: ALLOW_DOH_FAKEIP_FALLBACK
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: ALLOW_DOH_FAKEIP_FALLBACK
            - name: MEDIA_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: MEDIA_CONCURRENCY
            - name: BLOB_GC_GRACE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: BLOB_GC_GRACE_SECONDS
            - name: APP_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: APP_PUBLIC_ORIGIN
                  optional: true
            - name: OPENMOTION_TRACKING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENMOTION_TRACKING_ENABLED
                  optional: true
            - name: OPENMOTION_POSTHOG_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENMOTION_POSTHOG_TOKEN
                  optional: true
            - name: OPENMOTION_POSTHOG_HOST
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENMOTION_POSTHOG_HOST
                  optional: true
            - name: OPENMOTION_TRACKING_INSTALLATION_ID
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENMOTION_TRACKING_INSTALLATION_ID
                  optional: true
            - name: OPENMOTION_TRACERT_SPM_A
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENMOTION_TRACERT_SPM_A
                  optional: true
            - name: OPENMOTION_TRACERT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: openmotion-config
                  key: OPENMOTION_TRACERT_ENDPOINT
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
