# Example Kubernetes Secret template — DO NOT commit real credentials.
# Provision `openmotion-secrets` in namespace `openmotion` via External Secrets Operator,
# Sealed Secrets, or SOPS. Every key matches src/infra/config.ts verbatim.
apiVersion: v1
kind: Secret
metadata:
  name: openmotion-secrets
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-secrets
    app.kubernetes.io/part-of: openmotion
type: Opaque
stringData:
  DATABASE_URL: "postgres://openmotion:CHANGE_ME_POSTGRES_PASSWORD@postgres.openmotion.svc.cluster.local:5432/openmotion?sslmode=require"
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@redis.openmotion.svc.cluster.local:6379/0"
  REDIS_CACHE_URL: "redis://:CHANGE_ME_REDIS_CACHE_PASSWORD@redis-cache.openmotion.svc.cluster.local:6379/0"
  S3_ACCESS_KEY_ID: "CHANGE_ME_S3_ACCESS_KEY_ID"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME_S3_SECRET_ACCESS_KEY"
  SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_MIN_32_CHARACTERS"
  OIDC_CLIENT_SECRET: "CHANGE_ME_OIDC_CLIENT_SECRET"
  OPENDESIGN_S2S_API_KEY: "CHANGE_ME_OPENDESIGN_S2S_API_KEY"
  OPENDESIGN_ONE_TAP_INTERNAL_TOKEN: "CHANGE_ME_OPENDESIGN_ONE_TAP_INTERNAL_TOKEN"
---
# Dedicated Redis password secret consumed by KEDA TriggerAuthentication
# (`deploy/k8s/worker-render-keda.yaml`). Provision alongside `openmotion-secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: openmotion-keda-redis-auth
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-keda-redis-auth
    app.kubernetes.io/part-of: openmotion
type: Opaque
stringData:
  password: "CHANGE_ME_REDIS_PASSWORD"
