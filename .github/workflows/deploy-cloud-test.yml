name: Release default cloud test environment

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - deploy/Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - shared/**
      - gateway/**
      - tracking/**
      - studio/**
      - skills/**
      - packages/**
      - templates/**
      - web/**
      - mcp-ui/**
      - library/**
      - template-library/**
      - scripts/**
      - docs/transcripts.md
      - hyperframes.ts
      - server.ts
      - template-library.ts
      - LICENSE
      - .github/workflows/ci.yml
      - .github/workflows/container-images.yml
      - .github/workflows/deploy-cloud-test.yml
      - .github/scripts/orbit-publish-cloud-test.mjs
      - .github/scripts/promote-cloud-test.sh
  workflow_dispatch: {}

permissions: {}

jobs:
  checks:
    if: github.repository == 'nexu-io/openmotion' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  images:
    if: github.repository == 'nexu-io/openmotion' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/container-images.yml

  promote:
    name: Publish tested image digests for Argo CD
    environment: orbit-cloud-test
    needs: [checks, images]
    if: github.repository == 'nexu-io/openmotion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Publish tested image digests to Orbit
        if: vars.ORBIT_OPENMOTION_PULL == 'true'
        env:
          ORBIT_API_URL: ${{ vars.ORBIT_API_URL }}
          ORBIT_OPENMOTION_BUILD_TOKEN: ${{ secrets.ORBIT_OPENMOTION_BUILD_TOKEN }}
        run: node .github/scripts/orbit-publish-cloud-test.mjs "$RUNNER_TEMP/digests"
      - name: Advance the default test release
        if: vars.ORBIT_OPENMOTION_PULL != 'true'
        run: bash .github/scripts/promote-cloud-test.sh "$RUNNER_TEMP/digests"
