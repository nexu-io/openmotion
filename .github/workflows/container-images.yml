name: Build and push container images

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also update the :latest tag (normally only set on main)"
        type: boolean
        default: false
  push:
    branches:
      - main
      - feat/cloud-container-p1
    paths:
      - deploy/Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - shared/**
      - gateway/**
      - tracking/**
      - studio/**
      - skills/**
      - packages/**
      - templates/**
      - web/**
      - mcp-ui/**
      - library/**
      - template-library/**
      - scripts/**
      - docs/transcripts.md
      - hyperframes.ts
      - server.ts
      - template-library.ts
      - .github/workflows/container-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push 4 OpenMotion images (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          sha_tag="sha-${GITHUB_SHA::12}"
          sanitized_branch="$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          branch_tag="branch-${sanitized_branch}"
          push_latest="false"
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$INPUT_PUBLISH_LATEST" == "true" ]]; then
            push_latest="true"
          fi

          emit_tags() {
            local key="$1"
            local image="$2"
            {
              echo "${key}<<EOF"
              echo "${image}:${sha_tag}"
              echo "${image}:${branch_tag}"
              if [[ "$push_latest" == "true" ]]; then
                echo "${image}:latest"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${push_latest}" >> "$GITHUB_OUTPUT"
          emit_tags "api_tags" "ghcr.io/nexu-io/openmotion-api"
          emit_tags "worker_media_tags" "ghcr.io/nexu-io/openmotion-worker-media"
          emit_tags "worker_render_tags" "ghcr.io/nexu-io/openmotion-worker-render"
          emit_tags "catalog_sync_tags" "ghcr.io/nexu-io/openmotion-catalog-sync"

      - name: Build and push api
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=openmotion-containers
          cache-to: type=gha,mode=max,scope=openmotion-containers
          tags: ${{ steps.meta.outputs.api_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/nexu-io/openmotion
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=openmotion-api

      - name: Build and push worker-media
        id: build_worker_media
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: worker-media
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=openmotion-containers
          cache-to: type=gha,mode=max,scope=openmotion-containers
          tags: ${{ steps.meta.outputs.worker_media_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/nexu-io/openmotion
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=openmotion-worker-media

      - name: Build and push worker-render
        id: build_worker_render
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: worker-render
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=openmotion-containers
          cache-to: type=gha,mode=max,scope=openmotion-containers
          tags: ${{ steps.meta.outputs.worker_render_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/nexu-io/openmotion
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=openmotion-worker-render

      - name: Build and push catalog-sync
        id: build_catalog_sync
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: catalog-sync
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=openmotion-containers
          cache-to: type=gha,mode=max,scope=openmotion-containers
          tags: ${{ steps.meta.outputs.catalog_sync_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/nexu-io/openmotion
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=openmotion-catalog-sync

      - name: Summarize published images
        shell: bash
        run: |
          {
            echo "## OpenMotion Container Images"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Tag: \`${{ steps.meta.outputs.sha_tag }}\` (branch: \`${{ steps.meta.outputs.branch_tag }}\`, latest: \`${{ steps.meta.outputs.push_latest }}\`)"
            echo ""
            echo "| Component | Image Ref | Digest |"
            echo "| --- | --- | --- |"
            echo "| \`api\` | \`ghcr.io/nexu-io/openmotion-api:${{ steps.meta.outputs.sha_tag }}\` | \`${{ steps.build_api.outputs.digest }}\` |"
            echo "| \`worker-media\` | \`ghcr.io/nexu-io/openmotion-worker-media:${{ steps.meta.outputs.sha_tag }}\` | \`${{ steps.build_worker_media.outputs.digest }}\` |"
            echo "| \`worker-render\` | \`ghcr.io/nexu-io/openmotion-worker-render:${{ steps.meta.outputs.sha_tag }}\` | \`${{ steps.build_worker_render.outputs.digest }}\` |"
            echo "| \`catalog-sync\` | \`ghcr.io/nexu-io/openmotion-catalog-sync:${{ steps.meta.outputs.sha_tag }}\` | \`${{ steps.build_catalog_sync.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
