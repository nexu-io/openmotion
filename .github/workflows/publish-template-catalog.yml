name: Publish hosted template catalog
run-name: Hosted template catalog · ${{ github.sha }}

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: hosted-template-catalog-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nexu-io/openmotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted control code
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout sanitized source as data
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          path: catalog-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - name: Fetch catalog LFS sources only
        working-directory: catalog-source
        run: git lfs pull --include="library/templates/catalog/**,library/skills/**" --exclude=""
      - name: Publish the content-addressed main catalog
        working-directory: catalog-source
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/publish-template-catalog.mjs" main
